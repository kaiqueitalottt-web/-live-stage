<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#03040a">
<title>LIVE Stage V6</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

body{overscroll-behavior:none}

#stage{
  position:relative;
  height:72vh;
  min-height:470px;
  overflow:hidden;
  isolation:isolate;
  background:
    radial-gradient(ellipse at 50% 58%,rgba(0,140,255,.20),transparent 36%),
    linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.62)),
    url("fundo.jpg") center/cover no-repeat;
}

#stage:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(ellipse at 50% 88%,rgba(0,160,255,.28),transparent 38%);
  pointer-events:none;
  z-index:1;
}

#stage:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,rgba(255,0,55,.10),transparent 22%,transparent 78%,rgba(0,150,255,.10));
  pointer-events:none;
  z-index:2;
}

.beam{
  position:absolute;
  top:-40%;
  height:180%;
  width:24%;
  filter:blur(18px);
  opacity:.22;
  mix-blend-mode:screen;
  pointer-events:none;
  z-index:3;
  transform-origin:50% 0;
}

.beam.blue{
  left:0;
  background:linear-gradient(90deg,transparent,#009cff,transparent);
  animation:blueBeam 4s ease-in-out infinite alternate;
}

.beam.red{
  right:0;
  background:linear-gradient(90deg,transparent,#ff1744,transparent);
  animation:redBeam 4.6s ease-in-out infinite alternate;
}

@keyframes blueBeam{
  from{transform:rotate(7deg)}
  to{transform:rotate(22deg)}
}

@keyframes redBeam{
  from{transform:rotate(-7deg)}
  to{transform:rotate(-22deg)}
}

#spotlight{
  position:absolute;
  left:50%;
  bottom:-8%;
  width:65%;
  height:60%;
  transform:translateX(-50%);
  background:radial-gradient(ellipse,rgba(255,255,255,.20),rgba(0,150,255,.10) 35%,transparent 70%);
  filter:blur(15px);
  z-index:4;
}

#floorGlow{
  position:absolute;
  left:50%;
  bottom:6%;
  width:340px;
  height:100px;
  transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,180,255,.65),rgba(0,70,255,.12) 45%,transparent 72%);
  filter:blur(11px);
  z-index:5;
}

#hud{
  position:absolute;
  top:max(12px,env(safe-area-inset-top));
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  z-index:90;
  pointer-events:none;
}

.pill{
  padding:8px 13px;
  border-radius:999px;
  background:rgba(0,0,0,.68);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(12px);
  font-size:12px;
  font-weight:900;
}

.liveDot{
  display:inline-block;
  width:7px;
  height:7px;
  margin-right:6px;
  border-radius:50%;
  background:#ff1744;
  box-shadow:0 0 14px #ff1744;
  animation:liveDot 1s infinite;
}

@keyframes liveDot{
  50%{transform:scale(1.5);opacity:.45}
}

#status{
  position:absolute;
  top:62px;
  left:50%;
  transform:translateX(-50%);
  z-index:90;
  max-width:88%;
  padding:9px 17px;
  border-radius:999px;
  background:rgba(0,0,0,.72);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(12px);
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#name{
  position:absolute;
  left:50%;
  bottom:23%;
  z-index:80;
  transform:translate(-50%,18px) scale(.9);
  padding:9px 18px;
  border-radius:13px;
  background:rgba(0,0,0,.88);
  border:1px solid rgba(255,255,255,.20);
  box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 25px rgba(0,150,255,.15);
  font-size:14px;
  font-weight:900;
  opacity:0;
  transition:.4s;
  white-space:nowrap;
}

#name.show{
  opacity:1;
  transform:translate(-50%,0) scale(1);
}

#shadow{
  position:absolute;
  left:50%;
  bottom:10%;
  width:110px;
  height:23px;
  transform:translateX(-50%) scale(.5);
  border-radius:50%;
  background:rgba(0,0,0,.82);
  filter:blur(7px);
  opacity:0;
  z-index:12;
  transition:.4s;
}

/* PERSONAGEM */

#character{
  position:absolute;
  left:50%;
  bottom:10%;
  width:190px;
  height:330px;
  display:none;
  z-index:30;
  transform-origin:50% 100%;
  will-change:transform,opacity;
  filter:drop-shadow(0 18px 14px rgba(0,0,0,.58));
}

.head{
  position:absolute;
  left:62px;
  top:0;
  width:66px;
  height:70px;
  border-radius:46%;
  z-index:6;
  box-shadow:inset -9px -10px 15px rgba(0,0,0,.35),inset 7px 5px 12px rgba(255,255,255,.08);
}

.body{
  position:absolute;
  left:51px;
  top:60px;
  width:88px;
  height:112px;
  border-radius:27px 27px 20px 20px;
  z-index:5;
  box-shadow:inset -13px -11px 18px rgba(0,0,0,.32),inset 8px 5px 12px rgba(255,255,255,.08);
}

.arm{
  position:absolute;
  top:70px;
  width:24px;
  height:110px;
  border-radius:22px;
  transform-origin:50% 10px;
  z-index:4;
}

.arm.l{left:27px}
.arm.r{right:27px}

.leg{
  position:absolute;
  top:164px;
  width:29px;
  height:124px;
  border-radius:21px;
  transform-origin:50% 9px;
  z-index:3;
}

.leg.l{left:56px}
.leg.r{right:56px}

.eye{
  position:absolute;
  top:28px;
  width:21px;
  height:12px;
  background:#fff;
  border-radius:70% 25%;
  box-shadow:0 0 11px #fff;
}

.eye.l{left:12px;transform:rotate(-17deg)}
.eye.r{right:12px;transform:rotate(17deg)}

.emblem{
  position:absolute;
  left:50%;
  top:27px;
  transform:translateX(-50%);
  font-size:30px;
  font-weight:1000;
  text-shadow:0 2px 8px #000;
}

/* CAMINHADA */

#character.walk .arm.l{
  animation:walkL .34s infinite alternate ease-in-out;
}

#character.walk .arm.r{
  animation:walkR .34s infinite alternate ease-in-out;
}

#character.walk .leg.l{
  animation:legL .34s infinite alternate ease-in-out;
}

#character.walk .leg.r{
  animation:legR .34s infinite alternate ease-in-out;
}

@keyframes walkL{
  from{transform:rotate(28deg)}
  to{transform:rotate(-28deg)}
}

@keyframes walkR{
  from{transform:rotate(-28deg)}
  to{transform:rotate(28deg)}
}

@keyframes legL{
  from{transform:rotate(-18deg)}
  to{transform:rotate(18deg)}
}

@keyframes legR{
  from{transform:rotate(18deg)}
  to{transform:rotate(-18deg)}
}

/* DANÇA */

#character.dance .arm.l{
  animation:danceArmL .48s infinite alternate ease-in-out;
}

#character.dance .arm.r{
  animation:danceArmR .48s infinite alternate ease-in-out;
}

#character.dance .leg.l{
  animation:danceLegL .48s infinite alternate ease-in-out;
}

#character.dance .leg.r{
  animation:danceLegR .48s infinite alternate ease-in-out;
}

#character.dance .body{
  animation:danceBody .48s infinite alternate ease-in-out;
}

#character.dance .head{
  animation:danceHead .48s infinite alternate ease-in-out;
}

@keyframes danceArmL{
  0%{transform:rotate(-48deg) translateY(0)}
  50%{transform:rotate(20deg) translateY(-13px)}
  100%{transform:rotate(58deg) translateY(-5px)}
}

@keyframes danceArmR{
  0%{transform:rotate(48deg) translateY(-5px)}
  50%{transform:rotate(-20deg) translateY(-13px)}
  100%{transform:rotate(-58deg) translateY(0)}
}

@keyframes danceLegL{
  0%{transform:rotate(15deg)}
  50%{transform:rotate(-10deg) translateY(-6px)}
  100%{transform:rotate(18deg)}
}

@keyframes danceLegR{
  0%{transform:rotate(-15deg)}
  50%{transform:rotate(10deg) translateY(-6px)}
  100%{transform:rotate(-18deg)}
}

@keyframes danceBody{
  0%{transform:translateY(0) rotate(-3deg) scale(1)}
  50%{transform:translateY(-11px) rotate(3deg) scale(1.035)}
  100%{transform:translateY(0) rotate(-2deg) scale(1)}
}

@keyframes danceHead{
  0%{transform:rotate(-5deg)}
  50%{transform:rotate(6deg) translateY(-3px)}
  100%{transform:rotate(-3deg)}
}

/* ENTRADA */

#character.enter{
  display:block!important;
  animation:enter 1.6s cubic-bezier(.12,.82,.18,1) forwards;
}

@keyframes enter{
  0%{
    transform:translateX(-230%) translateY(28px) scale(.38);
    opacity:0;
    filter:blur(7px) drop-shadow(0 18px 14px rgba(0,0,0,.4));
  }
  25%{opacity:1}
  65%{
    transform:translateX(-37%) translateY(-5px) scale(1.06);
    filter:blur(0) drop-shadow(0 18px 14px rgba(0,0,0,.58));
  }
  100%{
    transform:translateX(-50%) translateY(0) scale(1);
    opacity:1;
  }
}

/* POSE */

#character.pose{
  animation:pose .8s ease-in-out;
}

#character.pose .arm.l{
  transform:rotate(-48deg);
}

#character.pose .arm.r{
  transform:rotate(48deg);
}

#character.pose .body{
  transform:translateY(-6px) scale(1.04);
}

@keyframes pose{
  0%{transform:translateX(-50%) scale(1)}
  50%{transform:translateX(-50%) translateY(-13px) scale(1.07)}
  100%{transform:translateX(-50%) scale(1)}
}

/* SAÍDA */

#character.exit{
  animation:exit 1.55s cubic-bezier(.72,0,.88,.22) forwards;
}

@keyframes exit{
  0%{
    transform:translateX(-50%) translateY(0) scale(1);
    opacity:1;
  }
  30%{
    transform:translateX(-18%) translateY(-3px) scale(.97);
    opacity:1;
  }
  100%{
    transform:translateX(190%) translateY(12px) scale(.46);
    opacity:0;
    filter:blur(4px) drop-shadow(0 15px 12px rgba(0,0,0,.4));
  }
}

/* PERSONAGENS */

/* PARTICULAS */

.particle{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 14px #fff;
  z-index:25;
  pointer-events:none;
  animation:particle .95s ease-out forwards;
}

@keyframes particle{
  to{
    transform:translate(var(--x),var(--y)) scale(.1);
    opacity:0;
  }
}

  <div class="beam blue"></div>

/* =========================================================

function normalizar(texto){

  return String(texto||"")
    .toLowerCase()
    .trim()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");

}


/* =========================================================

========================================================= */

function particulas(){

  const stage=document.getElementById("stage");

  for(let i=0;i<28;i++){

    const p=document.createElement("span");

    p.className="particle";

    p.style.left=
      (50+(Math.random()*25-12.5))+"%";

    p.style.top=

    p.style.setProperty(
      "--x",
      (Math.random()*240-120)+"px"
    );

    p.style.setProperty(
      "--y",
      (Math.random()*-180)+"px"
    );

    stage.appendChild(p);

    setTimeout(()=>p.remove(),1000);

  }

}


/* =========================================================
   FILA
========================================================= */

function atualizarFila(){

  queueText.textContent=
    fila.length
      ? fila.map(p=>p.emoji+" "+p.nome).join(" → ")
      : "vazia";

}


/* =========================================================
   INICIAR POR NOME
========================================================= */

function iniciarPorNome(valor){

  const chave=normalizar(valor);
  const personagem=personagens[chave];

  if(!personagem){

    statusEl.textContent=
      "❌ Personagem não encontrado";

    return;

  }

  if(ocupado){

    fila.push(personagem);

    atualizarFila();

    statusEl.textContent=
      "➕ "+personagem.nome+
      " entrou na fila";

    return;

  }

  iniciar(personagem);

}


/* =========================================================
   ANIMAÇÃO COMPLETA
========================================================= */

function iniciar(personagem){

  ocupado=true;

  total++;

  counter.textContent=
    total+
    (total===1?" personagem":" personagens");


  hero.style.display="block";

  hero.className=
    personagem.classe+" enter";


  nameEl.textContent=
    personagem.emoji+
    " "+
    personagem.nome;

  nameEl.classList.add("show");

  shadow.style.opacity=".65";

  shadow.style.transform=
    "translateX(-50%) scale(.65)";

  statusEl.textContent=
    "🚪 "+personagem.nome+
    " está entrando...";

  particulas();


  /* CAMINHADA */

  setTimeout(()=>{

    hero.className=
      personagem.classe+" walk";

    statusEl.textContent=
      "🚶 "+personagem.nome+
      " caminhando para o centro...";

    shadow.style.transform=
      "translateX(-50%) scale(.85)";

  },1600);


  /* DANÇA */

  setTimeout(()=>{

    hero.className=
      personagem.classe+" dance";

    statusEl.textContent=
      "🕺 "+personagem.nome+
      " está dançando!";

    particulas();

  },3000);


  /* SEGUNDA EXPLOSÃO DE EFEITO */

  setTimeout(()=>{

    particulas();

  },5000);


  /* POSE */

  setTimeout(()=>{

    hero.className=
      personagem.classe+" pose";

    statusEl.textContent=
      "✨ "+personagem.nome+
      " fez a pose!";

    particulas();

  },6600);


  /* SAÍDA */

  setTimeout(()=>{

    hero.className=
      personagem.classe+" exit";

    nameEl.classList.remove("show");

    statusEl.textContent=
      "🚪 "+personagem.nome+
      " está saindo...";

  },7500);


  /* FINAL */

  setTimeout(()=>{

    hero.style.display="none";

    hero.className=
      personagem.classe;

    shadow.style.opacity="0";

    nameEl.classList.remove("show");

    ocupado=false;

    statusEl.textContent=
      "🟢 LIVE Stage pronto";


    if(fila.length){

      const proximo=fila.shift();

      atualizarFila();

      setTimeout(
        ()=>iniciar(proximo),
        500
      );

    }else{

      atualizarFila();

    }

  },9100);

}


/* =========================================================
   TESTAR
========================================================= */

function testar(){

  const campo=
    document.getElementById("cmd");

  const valor=
    campo.value;

  campo.value="";

  iniciarPorNome(valor);

}

========================================================= */

  .getElementById("cmd")

    }
  );


/* =========================================================
   PRESENTE → PERSONAGEM
========================================================= */

function receberPresenteTikTok(nomePresente){

  const chave=
    normalizar(nomePresente);

  const personagem=
    presentes[chave];

  if(!personagem){

    statusEl.textContent=
      "🎁 Presente recebido: "+
      nomePresente;

    return;

  }

  iniciarPorNome(personagem);

}


/* =========================================================
   EVENTO EXTERNO
========================================================= */

window.addEventListener("message",event=>{

  const data=event.data||{};

  if(data.type==="gift"){

    receberPresenteTikTok(
      data.gift
    );

  }

});


/* =========================================================
   DISPONIBILIZA PARA O WORKER
========================================================= */

window.receberPresenteTikTok=
  receberPresenteTikTok;

</script>
