<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#03040a">
<title>LIVE Stage V5</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

body{
  overscroll-behavior:none;
}

/* =========================================================
   ARENA
========================================================= */

#stage{
  position:relative;
  height:72vh;
  min-height:470px;
  overflow:hidden;
  isolation:isolate;

  background:
    radial-gradient(
      ellipse at 50% 58%,
      rgba(0,130,255,.18),
      transparent 34%
    ),
    linear-gradient(
      180deg,
      rgba(0,0,0,.04),
      rgba(0,0,0,.60)
    ),
    url("fundo.jpg") center/cover no-repeat;
}

#stage::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(
      ellipse at 50% 85%,
      rgba(0,155,255,.23),
      transparent 35%
    );
  pointer-events:none;
  z-index:1;
}

#stage::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      rgba(255,0,50,.08),
      transparent 20%,
      transparent 80%,
      rgba(0,140,255,.08)
    );
  pointer-events:none;
  z-index:2;
}

/* =========================================================
   LUZES
========================================================= */

.beam{
  position:absolute;
  top:-35%;
  height:170%;
  width:24%;
  pointer-events:none;
  filter:blur(17px);
  opacity:.22;
  mix-blend-mode:screen;
  transform-origin:50% 0;
  z-index:3;
}

.beam.blue{
  left:2%;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(0,160,255,.85),
    transparent
  );
  transform:rotate(15deg);
  animation:beamBlue 4s ease-in-out infinite alternate;
}

.beam.red{
  right:2%;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,0,55,.85),
    transparent
  );
  transform:rotate(-15deg);
  animation:beamRed 4.7s ease-in-out infinite alternate;
}

@keyframes beamBlue{
  from{transform:rotate(8deg)}
  to{transform:rotate(22deg)}
}

@keyframes beamRed{
  from{transform:rotate(-8deg)}
  to{transform:rotate(-22deg)}
}

#spotlight{
  position:absolute;
  left:50%;
  bottom:-5%;
  width:55%;
  height:55%;
  transform:translateX(-50%);
  background:
    radial-gradient(
      ellipse,
      rgba(255,255,255,.20),
      rgba(0,140,255,.09) 35%,
      transparent 70%
    );
  filter:blur(14px);
  z-index:4;
  pointer-events:none;
}

#floorGlow{
  position:absolute;
  left:50%;
  bottom:5%;
  width:330px;
  height:95px;
  transform:translateX(-50%);
  border-radius:50%;
  background:
    radial-gradient(
      ellipse,
      rgba(0,160,255,.55),
      rgba(0,80,255,.12) 45%,
      transparent 72%
    );
  filter:blur(10px);
  z-index:5;
}

/* =========================================================
   HUD
========================================================= */

#hud{
  position:absolute;
  top:max(12px,env(safe-area-inset-top));
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  z-index:80;
  pointer-events:none;
}

.pill{
  padding:8px 13px;
  border-radius:999px;
  background:rgba(0,0,0,.62);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(12px);
  font-size:12px;
  font-weight:900;
  box-shadow:0 8px 25px rgba(0,0,0,.35);
}

.liveDot{
  display:inline-block;
  width:7px;
  height:7px;
  margin-right:6px;
  border-radius:50%;
  background:#ff1744;
  box-shadow:0 0 13px #ff1744;
  animation:livePulse 1s infinite;
}

@keyframes livePulse{
  50%{
    transform:scale(1.45);
    opacity:.5;
  }
}

#status{
  position:absolute;
  top:62px;
  left:50%;
  transform:translateX(-50%);
  z-index:80;
  padding:9px 17px;
  max-width:90%;
  border-radius:999px;
  background:rgba(0,0,0,.70);
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(13px);
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  transition:.3s;
}

/* =========================================================
   NOME
========================================================= */

#name{
  position:absolute;
  left:50%;
  bottom:23%;
  transform:translate(-50%,15px) scale(.92);
  z-index:75;
  padding:9px 18px;
  border-radius:13px;
  background:
    linear-gradient(
      135deg,
      rgba(0,0,0,.90),
      rgba(20,20,30,.88)
    );
  border:1px solid rgba(255,255,255,.20);
  box-shadow:
    0 8px 30px rgba(0,0,0,.45),
    0 0 20px rgba(0,130,255,.10);
  font-size:14px;
  font-weight:900;
  opacity:0;
  transition:.4s;
  white-space:nowrap;
}

#name.show{
  opacity:1;
  transform:translate(-50%,0) scale(1);
}

/* =========================================================
   SOMBRA
========================================================= */

#shadow{
  position:absolute;
  left:50%;
  bottom:10%;
  width:105px;
  height:22px;
  transform:translateX(-50%) scale(.5);
  border-radius:50%;
  background:rgba(0,0,0,.78);
  filter:blur(6px);
  opacity:0;
  z-index:12;
  transition:.35s;
}

/* =========================================================
   PERSONAGEM
========================================================= */

#character{
  position:absolute;
  left:50%;
  bottom:10%;
  width:190px;
  height:330px;
  display:none;
  z-index:30;
  transform-origin:50% 100%;
  will-change:transform,opacity,filter;
  filter:
    drop-shadow(0 18px 14px rgba(0,0,0,.55));
}

/* partes */

.head{
  position:absolute;
  left:62px;
  top:0;
  width:66px;
  height:70px;
  border-radius:46%;
  z-index:6;

  box-shadow:
    inset -9px -10px 14px rgba(0,0,0,.35),
    inset 7px 5px 12px rgba(255,255,255,.09);
}

.body{
  position:absolute;
  left:51px;
  top:60px;
  width:88px;
  height:112px;
  border-radius:27px 27px 20px 20px;
  z-index:5;

  box-shadow:
    inset -13px -11px 18px rgba(0,0,0,.32),
    inset 8px 5px 12px rgba(255,255,255,.08);
}

.arm{
  position:absolute;
  top:70px;
  width:24px;
  height:110px;
  border-radius:22px;
  transform-origin:50% 10px;
  z-index:4;
}

.arm.l{
  left:27px;
}

.arm.r{
  right:27px;
}

.leg{
  position:absolute;
  top:164px;
  width:29px;
  height:124px;
  border-radius:21px;
  transform-origin:50% 9px;
  z-index:3;
}

.leg.l{
  left:56px;
}

.leg.r{
  right:56px;
}

.eye{
  position:absolute;
  top:28px;
  width:21px;
  height:12px;
  background:#fff;
  border-radius:70% 25%;
  box-shadow:0 0 10px rgba(255,255,255,.9);
}

.eye.l{
  left:12px;
  transform:rotate(-17deg);
}

.eye.r{
  right:12px;
  transform:rotate(17deg);
}

.emblem{
  position:absolute;
  left:50%;
  top:28px;
  transform:translateX(-50%);
  font-size:29px;
  font-weight:1000;
  text-shadow:0 2px 8px #000;
}

/* =========================================================
   CAMINHADA
========================================================= */

#character.walk .arm.l{
  animation:walkArmL .34s infinite alternate ease-in-out;
}

#character.walk .arm.r{
  animation:walkArmR .34s infinite alternate ease-in-out;
}

#character.walk .leg.l{
  animation:walkLegL .34s infinite alternate ease-in-out;
}

#character.walk .leg.r{
  animation:walkLegR .34s infinite alternate ease-in-out;
}

@keyframes walkArmL{
  from{transform:rotate(25deg)}
  to{transform:rotate(-25deg)}
}

@keyframes walkArmR{
  from{transform:rotate(-25deg)}
  to{transform:rotate(25deg)}
}

@keyframes walkLegL{
  from{transform:rotate(-18deg)}
  to{transform:rotate(18deg)}
}

@keyframes walkLegR{
  from{transform:rotate(18deg)}
  to{transform:rotate(-18deg)}
}

/* =========================================================
   DANÇA
========================================================= */

#character.dance .arm.l{
  animation:danceLeft .46s infinite alternate ease-in-out;
}

#character.dance .arm.r{
  animation:danceRight .46s infinite alternate ease-in-out;
}

#character.dance .leg.l{
  animation:danceLegLeft .46s infinite alternate ease-in-out;
}

#character.dance .leg.r{
  animation:danceLegRight .46s infinite alternate ease-in-out;
}

#character.dance .body{
  animation:bodyDance .46s infinite alternate ease-in-out;
}

#character.dance .head{
  animation:headDance .46s infinite alternate ease-in-out;
}

@keyframes danceLeft{
  from{transform:rotate(-42deg) translateY(-3px)}
  to{transform:rotate(48deg) translateY(-12px)}
}

@keyframes danceRight{
  from{transform:rotate(42deg) translateY(-12px)}
  to{transform:rotate(-48deg) translateY(-3px)}
}

@keyframes danceLegLeft{
  from{transform:rotate(12deg)}
  to{transform:rotate(-12deg) translateY(-5px)}
}

@keyframes danceLegRight{
  from{transform:rotate(-12deg)}
  to{transform:rotate(12deg) translateY(-5px)}
}

@keyframes bodyDance{
  from{transform:translateY(0) rotate(-2deg)}
  to{transform:translateY(-10px) rotate(2deg)}
}

@keyframes headDance{
  from{transform:rotate(-3deg)}
  to{transform:rotate(4deg)}
}

/* =========================================================
   ENTRADA
========================================================= */

#character.enter{
  display:block!important;
  animation:enterStage 1.55s cubic-bezier(.12,.82,.18,1) forwards;
}

@keyframes enterStage{
  0%{
    transform:
      translateX(-220%)
      translateY(25px)
      scale(.42);
    opacity:0;
    filter:blur(6px) drop-shadow(0 18px 14px rgba(0,0,0,.4));
  }

  25%{
    opacity:1;
  }

  65%{
    transform:
      translateX(-38%)
      translateY(-4px)
      scale(1.05);
    filter:blur(0) drop-shadow(0 18px 14px rgba(0,0,0,.55));
  }

  100%{
    transform:
      translateX(-50%)
      translateY(0)
      scale(1);
    opacity:1;
  }
}

/* =========================================================
   POSE
========================================================= */

#character.pose .arm.l{
  transform:rotate(-38deg);
}

#character.pose .arm.r{
  transform:rotate(38deg);
}

#character.pose .body{
  transform:translateY(-5px) scale(1.035);
}

#character.pose{
  animation:posePulse .65s ease-in-out;
}

@keyframes posePulse{
  50%{
    transform:translateX(-50%) translateY(-8px) scale(1.04);
  }
}

/* =========================================================
   SAÍDA
========================================================= */

#character.exit{
  animation:exitStage 1.45s cubic-bezier(.72,0,.88,.22) forwards;
}

@keyframes exitStage{
  0%{
    transform:
      translateX(-50%)
      translateY(0)
      scale(1);
    opacity:1;
  }

  35%{
    transform:
      translateX(0%)
      translateY(-2px)
      scale(.94);
    opacity:1;
  }

  100%{
    transform:
      translateX(185%)
      translateY(12px)
      scale(.48);
    opacity:0;
    filter:blur(3px) drop-shadow(0 15px 12px rgba(0,0,0,.4));
  }
}

/* =========================================================
   PERSONAGENS
========================================================= */

.spider .body::after{

/* =========================================================
   PARTICULAS
========================================================= */

.particle{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 13px #fff;
  z-index:25;
  pointer-events:none;

  animation:
    particleFly .9s ease-out forwards;
}

@keyframes particleFly{
  to{
    transform:
      translate(var(--x),var(--y))
      scale(.1);
    opacity:0;
  }
}

/* =========================================================
   CONTROLES
========================================================= */

#controls{
  display:flex;
  gap:8px;
  padding:12px;
  background:
    linear-gradient(
      #08080c,
      #030303
    );
  border-top:1px solid rgba(255,255,255,.07);
}

#cmd{
  flex:1;
  min-width:0;
  padding:14px;
  color:#fff;
  background:#111118;
  border:1px solid #30303b;
  border-radius:13px;
  outline:none;
}

#cmd:focus{
  border-color:#7d7dff;
}

button{
  border:0;
  color:#fff;
  font-weight:900;
  border-radius:12px;
  background:
    linear-gradient(
      135deg,
      #7128ff,
      #ff1744
    );
}

#mainButton{
  padding:0 17px;
}

/* =========================================================
   TESTES
========================================================= */

#tests{
  padding:10px 12px;
  display:flex;
  gap:7px;
  overflow-x:auto;
  background:#050505;
  scrollbar-width:none;
}

#tests::-webkit-scrollbar{
  display:none;
}

.test{
  flex:0 0 auto;
  padding:9px 11px;
  background:#121218;
  border:1px solid #292934;
  font-size:12px;
}

/* =========================================================
   FILA
========================================================= */

#queue{
  padding:10px 12px;
  background:#070709;
  color:#aaa;
  font-size:12px;
  border-top:1px solid #15151a;
}

#queue strong{
  color:#fff;
}

/* =========================================================
   PAINÉIS
========================================================= */

#boxes{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  padding:12px;
  background:#000;
}

.box{
  height:105px;
  background:#000;
  border:1px solid #18181d;
  border-radius:13px;
  box-shadow:
    inset 0 0 25px rgba(255,255,255,.015);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

  #stage{
    height:67vh;
    min-height:440px;
  }

  #character{
    transform:translateX(-50%) scale(.80);
  }

  #status{
    top:56px;
    font-size:11px;
    max-width:86%;
  }

  #name{
    bottom:22%;
    font-size:13px;
  }

  #floorGlow{
    width:280px;
  }
}

/* =========================================================
   REDUZ MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
  }
}
</style>
</head>

<body>

<div id="stage">

  <div class="beam blue"></div>
  <div class="beam red"></div>

  <div id="spotlight"></div>
  <div id="floorGlow"></div>
  <div id="shadow"></div>

  <div id="hud">
    <div class="pill">
      <span class="liveDot"></span>
      LIVE STAGE
    </div>

    <div class="pill" id="counter">
      0 personagens
    </div>
  </div>

  <div id="status">
    🟢 LIVE Stage pronto
  </div>

  <div id="name"></div>

  <div id="character">

    <div class="head">
      <span class="eye l"></span>
      <span class="eye r"></span>
    </div>

    <div class="body">
      <span class="emblem"></span>
    </div>

    <div class="arm l"></div>
    <div class="arm r"></div>

    <div class="leg l"></div>
    <div class="leg r"></div>

  </div>

</div>


<!-- CONTROLE -->
<div id="controls">

  <input
    id="cmd"
    placeholder="Digite um personagem..."
    autocomplete="off"
  >

  <button
    id="mainButton"
    onclick="testar()"
  >
    TESTAR
  </button>

</div>


<!-- PERSONAGENS -->
<div id="tests"></div>


<!-- FILA -->
<div id="queue">
  Fila:
  <strong id="queueText">
    vazia
  </strong>
</div>


<!-- 3 QUADRADOS PRETOS -->
<div id="boxes">

  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>

</div>


<script>

/* =========================================================
   PERSONAGENS
========================================================= */

const personagens={

  "homem aranha":{
    nome:"Aranha Urbano",
    classe:"spider",
    emoji:"🕷️"
  },

  "aranha urbano":{
    nome:"Aranha Urbano",
    classe:"spider",
    emoji:"🕷️"
  },

  hulk:{
    nome:"Hulk",
    classe:"hulk",
    emoji:"💚"
  },

  batman:{
    nome:"Batman",
    classe:"batman",
    emoji:"🦇"
  },

  "homem de ferro":{
    nome:"Homem de Ferro",
    classe:"iron",
    emoji:"🤖"
  },

  superman:{
    nome:"Superman",
    classe:"superman",
    emoji:"🦸"
  },

  flash:{
    nome:"Flash",
    classe:"flash",
    emoji:"⚡"
  },

  "capitao america":{
    nome:"Capitão América",
    classe:"cap",
    emoji:"🛡️"
  },

  ninja:{
    nome:"Ninja Futurista",
    classe:"ninja",
    emoji:"🥷"
  },

  robo:{
    nome:"Robô Futurista",
    classe:"robot",
    emoji:"🤖"
  },

  alien:{
    nome:"Alienígena",
    classe:"alien",
    emoji:"👽"
  },

  mago:{
    nome:"Mago Arcano",
    classe:"mage",
    emoji:"🧙"
  },

  "ninja sombrio":{
    nome:"Ninja Sombrio",
    classe:"darkninja",
    emoji:"🥷"
  },

  titan:{
    nome:"Titã Robótico",
    classe:"titan",
    emoji:"🤖"
  },

  cosmico:{
    nome:"Alienígena Cósmico",
    classe:"cosmic",
    emoji:"👽"
  },

  dragao:{
    nome:"Dragão Guerreiro",
    classe:"dragon",
    emoji:"🐲"
  }

};


/* =========================================================
   PRESENTES
========================================================= */

const presentes={

  rosa:"homem aranha",
  rose:"homem aranha",

  leao:"hulk",
  lion:"hulk",

  coroa:"batman",
  crown:"batman",

  foguete:"homem de ferro",
  rocket:"homem de ferro",

  coracao:"superman",
  heart:"superman",

  raio:"flash",
  lightning:"flash",

  escudo:"capitao america",
  shield:"capitao america",

  estrela:"mago",
  star:"mago",

  dragao:"dragao",
  dragon:"dragao"

};


/* =========================================================
   ELEMENTOS
========================================================= */

const hero=
  document.getElementById("character");

const nameEl=
  document.getElementById("name");

const statusEl=
  document.getElementById("status");

const shadow=
  document.getElementById("shadow");

const counter=
  document.getElementById("counter");

const queueText=
  document.getElementById("queueText");


/* =========================================================
   ESTADO
========================================================= */

let ocupado=false;
let total=0;
let fila=[];


/* =========================================================
   NORMALIZA TEXTO
========================================================= */

function normalizar(texto){

  return String(texto || "")
    .toLowerCase()
    .trim()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");

}


/* =========================================================
   PARTICULAS
========================================================= */

function criarParticulas(){

  const stage=
    document.getElementById("stage");

  for(let i=0;i<24;i++){

    const p=
      document.createElement("span");

    p.className="particle";

    p.style.left=
      (50 + (Math.random()*25-12.5))+"%";

    p.style.top=
      (69 + (Math.random()*12-6))+"%";

    p.style.setProperty(
      "--x",
      (Math.random()*220-110)+"px"
    );

    p.style.setProperty(
      "--y",
      (Math.random()*-170)+"px"
    );

    stage.appendChild(p);

    setTimeout(()=>{
      p.remove();
    },950);

  }

}


/* =========================================================
   ATUALIZA FILA
========================================================= */

function atualizarFila(){

  if(!fila.length){

    queueText.textContent="vazia";

    return;
  }

  queueText.textContent=
    fila.map(
      p=>p.emoji+" "+p.nome
    ).join("  →  ");

}


/* =========================================================
   INICIAR POR NOME
========================================================= */

function iniciarPorNome(valor){

  const chave=
    normalizar(valor);

  const personagem=
    personagens[chave];

  if(!personagem){

    statusEl.textContent=
      "❌ Personagem não encontrado";

    return;
  }

  if(ocupado){

    fila.push(personagem);

    atualizarFila();

    statusEl.textContent=
      "➕ "+personagem.nome+
      " entrou na fila";

    return;
  }

  iniciar(personagem);

}


/* =========================================================
   INICIAR PERSONAGEM
========================================================= */

function iniciar(personagem){

  ocupado=true;

  total++;

  counter.textContent=
    total+
    (total===1
      ?" personagem"
      :" personagens");


  /* RESET */

  hero.style.display="block";

  hero.className=
    personagem.classe+" enter";


  /* NOME */

  nameEl.textContent=
    personagem.emoji+
    " "+
    personagem.nome;

  nameEl.classList.add("show");


  /* STATUS */

  statusEl.textContent=
    "🚪 "+
    personagem.nome+
    " está entrando...";


  /* SOMBRA */

  shadow.style.opacity=".65";

  shadow.style.transform=
    "translateX(-50%) scale(.65)";


  /* PARTICULAS */

  criarParticulas();


  /* -------------------------------------------------------
     CAMINHADA
  ------------------------------------------------------- */

  setTimeout(()=>{

    hero.className=
      personagem.classe+" walk";

    statusEl.textContent=
      "🚶 "+
      personagem.nome+
      " caminhando até o palco...";

    shadow.style.transform=
      "translateX(-50%) scale(.82)";

  },1500);


  /* -------------------------------------------------------
     DANÇA
  ------------------------------------------------------- */

  setTimeout(()=>{

    hero.className=
      personagem.classe+" dance";

    statusEl.textContent=
      "💃 "+
      personagem.nome+
      " está dançando!";

    shadow.style.transform=
      "translateX(-50%) scale(1)";

    criarParticulas();

  },2700);


  /* -------------------------------------------------------
     POSE
  ------------------------------------------------------- */

  setTimeout(()=>{

    hero.className=
      personagem.classe+" pose";

    statusEl.textContent=
      "✨ "+
      personagem.nome+
      " fez uma pose!";

  },6500);


  /* -------------------------------------------------------
     SAÍDA
  ------------------------------------------------------- */

  setTimeout(()=>{

    hero.className=
      personagem.classe+" exit";

    nameEl.classList.remove("show");

    statusEl.textContent=
      "🚪 "+
      personagem.nome+
      " está saindo...";

    criarParticulas();

  },7200);


  /* -------------------------------------------------------
     FINAL
  ------------------------------------------------------- */

  setTimeout(()=>{

    hero.style.display="none";

    hero.className=
      personagem.classe;

    shadow.style.opacity="0";

    nameEl.classList.remove("show");

    statusEl.textContent=
      "🟢 LIVE Stage pronto";

    ocupado=false;


    /* PRÓXIMO DA FILA */

    if(fila.length){

      const proximo=
        fila.shift();

      atualizarFila();

      setTimeout(()=>{

        iniciar(proximo);

      },500);

    }else{

      atualizarFila();

    }

  },8700);

}


/* =========================================================
   BOTÃO TESTAR
========================================================= */

function testar(){

  const campo=
    document.getElementById("cmd");

  const valor=
    campo.value;

  campo.value="";

  iniciarPorNome(valor);

}


/* =========================================================
   BOTÕES AUTOMÁTICOS
========================================================= */

const listaTestes=[

  ["🕷️","homem aranha"],
  ["💚","hulk"],
  ["🦇","batman"],
  ["🤖","homem de ferro"],
  ["🦸","superman"],
  ["⚡","flash"],
  ["🛡️","capitao america"],
  ["🥷","ninja"],
  ["🤖","robo"],
  ["👽","alien"],
  ["🧙","mago"],
  ["🥷","ninja sombrio"],
  ["🤖","titan"],
  ["👽","cosmico"],
  ["🐲","dragao"]

];


const tests=
  document.getElementById("tests");


listaTestes.forEach(
  ([emoji,nome])=>{

    const button=
      document.createElement("button");

    button.className="test";

    button.textContent=
      emoji+
      " "+
      personagens[nome].nome;

    button.onclick=()=>{
      iniciarPorNome(nome);
    };

    tests.appendChild(button);

  }
);


/* =========================================================
   ENTER NO INPUT
========================================================= */

document
  .getElementById("cmd")
  .addEventListener(
    "keydown",
    event=>{

      if(event.key==="Enter"){

        testar();

      }

    }
  );


/* =========================================================
   PRESENTE → PERSONAGEM
========================================================= */

function receberPresenteTikTok(nomePresente){

  const chave=
    normalizar(nomePresente);

  const personagem=
    presentes[chave];

  if(!personagem){

    statusEl.textContent=
      "🎁 Presente recebido: "+
      nomePresente;

    return;
  }

  iniciarPorNome(personagem);

}


/* =========================================================
   EVENTOS RECEBIDOS DO WORKER
=========================================================

   Quando a integração autorizada estiver pronta,
   o Worker poderá enviar algo como:

   {
      type:"gift",
      gift:"rosa"
   }

========================================================= */

window.addEventListener(
  "message",
  event=>{

    const data=
      event.data || {};

    if(data.type==="gift"){

      receberPresenteTikTok(
        data.gift
      );

    }

  }
);


/* =========================================================
   FUNÇÃO GLOBAL PARA TESTES
========================================================= */

window.receberPresenteTikTok=
  receberPresenteTikTok;


/*

TESTE DE PRESENTE:

receberPresenteTikTok("rosa");

RESULTADO:

rosa
 ↓
Aranha Urbano
 ↓
entra
 ↓
caminha
 ↓
dança
 ↓
pose
 ↓
sai

*/

</script>

</body>
</html>
