<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

body{
  background:#000;

/* =====================================================
   PALCO
===================================================== */

#stage{
  position:relative;
  width:100%;
  height:70vh;
  min-height:470px;
  overflow:hidden;

  background:
    linear-gradient(
      rgba(0,0,0,.08),
      rgba(0,0,0,.45)
    ),
    url("fundo.jpg") center/cover no-repeat;
}

#stage:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(
      ellipse at center bottom,
      transparent 25%,
      rgba(0,0,0,.5) 100%
    );
}

/* =====================================================
   LUZES
===================================================== */

.beam{
  position:absolute;
  top:-30%;
  width:18%;
  height:150%;
  opacity:.14;
  filter:blur(22px);
  transform-origin:top center;
  pointer-events:none;
  z-index:2;
  animation:sweep 4s ease-in-out infinite alternate;
}

.beam.blue{
  left:8%;
  background:#008cff;
}

.beam.red{
  right:8%;
  background:#ff1744;
  animation-delay:-2s;
}

@keyframes sweep{
  from{transform:rotate(10deg)}
  to{transform:rotate(-10deg)}
}

/* =====================================================
   STATUS
===================================================== */

#status{
  position:absolute;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  z-index:100;

  padding:9px 17px;
  border-radius:22px;

  background:rgba(0,0,0,.78);
  border:1px solid rgba(255,255,255,.2);

  font-size:13px;
  font-weight:bold;
  white-space:nowrap;

  box-shadow:
    0 5px 25px rgba(0,0,0,.35);
}

#name{
  position:absolute;
  left:50%;
  bottom:8%;
  transform:translateX(-50%);

  z-index:80;

  padding:8px 18px;
  border-radius:13px;

  background:rgba(5,5,8,.9);
  border:1px solid rgba(255,255,255,.2);

  font-weight:bold;
  font-size:14px;

  display:none;

  box-shadow:0 5px 25px rgba(0,0,0,.4);
}

/* =====================================================
   PERSONAGEM 2D
===================================================== */

#character{
  position:absolute;

  left:50%;
  bottom:9%;

  width:180px;
  height:330px;

  z-index:60;

  display:none;

  transform-origin:center bottom;

  filter:

/* cabeça */

  position:absolute;
  left:58px;

  z-index:8;

  box-shadow:

/* cabelo */

/* =====================================================
   ANIMAÇÃO DE ENTRADA
===================================================== */

.enter{
  display:block!important;
  animation:
    entrance 1.25s cubic-bezier(.16,.82,.25,1) forwards;
}

@keyframes entrance{
  0%{
    opacity:0;
    transform:
      translate(-170%,30px)
      rotate(-12deg)
      scale(.5);
  }

  65%{
    opacity:1;
    transform:
      translate(-45%,0)
      rotate(4deg)
      scale(1.08);
  }

  100%{
    opacity:1;
    transform:
      translate(-50%,0)
      rotate(0)
      scale(1);
  }
}

/* =====================================================
   DANÇA — BRAÇOS + PERNAS + CORPO
===================================================== */

.dance{
  display:block!important;
  animation:bodyDance .48s infinite alternate ease-in-out;
}

.dance .head{
  animation:headDance .48s infinite alternate ease-in-out;
}

.dance .arm.l{
  animation:armLeft .42s infinite alternate ease-in-out;
}

.dance .arm.r{
  animation:armRight .42s infinite alternate ease-in-out;
}

.dance .leg.l{
  animation:legLeft .48s infinite alternate ease-in-out;
}

.dance .leg.r{
  animation:legRight .48s infinite alternate ease-in-out;
}

@keyframes bodyDance{
  0%{
    transform:
      translate(-50%,0)
      rotate(-3deg)
      scale(1);
  }

  50%{
    transform:
      translate(-50%,-13px)
      rotate(3deg)
      scale(1.035);
  }

  100%{
    transform:
      translate(-50%,0)
      rotate(-3deg)
      scale(1);
  }
}

@keyframes headDance{
  from{
    transform:rotate(-5deg);
  }
  to{
    transform:rotate(6deg);
  }
}

@keyframes armLeft{
  from{
    transform:rotate(22deg);
  }
  to{
    transform:rotate(-48deg);
  }
}

@keyframes armRight{
  from{
    transform:rotate(-22deg);
  }
  to{
    transform:rotate(48deg);
  }
}

@keyframes legLeft{
  from{
    transform:rotate(-9deg);
  }
  to{
    transform:rotate(16deg);
  }
}

@keyframes legRight{
  from{
    transform:rotate(9deg);
  }
  to{
    transform:rotate(-16deg);
  }
}

/* =====================================================
   SAÍDA
===================================================== */

.exit{
  display:block!important;
  animation:exitStage 1.35s cubic-bezier(.7,0,.9,.2) forwards;
}

.exit .arm.l{
  animation:none;
  transform:rotate(-35deg);
}

.exit .arm.r{
  animation:none;
  transform:rotate(35deg);
}

@keyframes exitStage{
  0%{
    opacity:1;
    transform:
      translate(-50%,0)
      scale(1);
  }

  30%{
    transform:
      translate(-48%,-18px)
      scale(1.04);
  }

  100%{
    opacity:0;
    transform:
      translate(155%,30px)
      rotate(12deg)
      scale(.58);
  }
}

/* =====================================================

  "cosmico":{
    nome:"Guerreiro Cósmico",
    classe:"cosmic"
  },

  "dragao":{
    nome:"Dragão Guerreiro",
    classe:"dragon"
  }

};

/* =====================================================
   NORMALIZAÇÃO
===================================================== */

function normalizar(texto){

  return texto
    .toLowerCase()
    .trim()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");

}

/* =====================================================
   TESTAR
===================================================== */

function testar(){

  const valor =
    document.getElementById("cmd").value;

  iniciarPorNome(valor);

  document.getElementById("cmd").value="";

}

/* =====================================================
   INICIAR POR NOME
===================================================== */

function iniciarPorNome(valor){

  const chave=normalizar(valor);

  const personagem=personagens[chave];

  if(!personagem){

    document.getElementById("status").textContent=
      "❌ Personagem não encontrado";

    return;
  }

  iniciar(personagem);

}

/* =====================================================
   ANIMAÇÃO
===================================================== */

let ocupado=false;

function iniciar(personagem){

  if(ocupado){

    document.getElementById("status").textContent=
      "⏳ O palco está ocupado";

    return;
  }

  ocupado=true;

  const hero=
    document.getElementById("character");

  const name=
    document.getElementById("name");

  const status=
    document.getElementById("status");

  /* limpar animações anteriores */

  hero.className="";

  void hero.offsetWidth;

  /* personagem */

  hero.className=
    personagem.classe+" enter";

  name.textContent=
    personagem.nome;

  name.style.display="block";

  status.textContent=
    "🚪 "+personagem.nome+
    " entrou no palco";

  /* começa a dança */

  setTimeout(()=>{

    hero.className=
      personagem.classe+" dance";

    status.textContent=
      "🔥 "+personagem.nome+
      " está dançando!";

  },1400);

  /* saída */

  setTimeout(()=>{

    hero.className=
      personagem.classe+" exit";

    status.textContent=
      "🚪 "+personagem.nome+
      " está saindo...";

  },6500);

  /* reset */

  setTimeout(()=>{

    hero.style.display="none";

    hero.className="";

    name.style.display="none";

    status.textContent=
      "🟢 LIVE Stage pronto";

    ocupado=false;

  },7900);

}

};

/* =====================================================
   RECEBER PRESENTE
===================================================== */

function receberPresenteTikTok(nomePresente){

  const chave=
    normalizar(nomePresente);

  const personagem=
    presentes[chave];

  if(!personagem){

    document.getElementById("status").textContent=
      "🎁 Presente recebido: "+
      nomePresente;

    return;
  }

  iniciarPorNome(personagem);

}

document

  );
