<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVE Stage V9 • 2D</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

/* =========================================================
   PALCO
   ========================================================= */

#stage{
  position:relative;
  width:100%;
  height:72vh;
  min-height:470px;
  overflow:hidden;

  background-image:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.08),
      rgba(0,0,0,.35)
    ),
    url("fundo.jpg");

  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
}

/* iluminação */

#stage::before{
  content:"";
  position:absolute;
  inset:-20%;
  pointer-events:none;

  background:
    linear-gradient(
      65deg,
      transparent 35%,
      rgba(0,170,255,.18) 48%,
      transparent 60%
    ),
    linear-gradient(
      -65deg,
      transparent 35%,
      rgba(255,0,70,.18) 48%,
      transparent 60%
    );

  animation:lights 5s ease-in-out infinite alternate;
}

@keyframes lights{
  from{
    transform:translateX(-5%) rotate(-2deg);
  }
  to{
    transform:translateX(5%) rotate(2deg);
  }
}

/* chão */

#stage::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:18%;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,.85),
      transparent
    );

  pointer-events:none;
}

/* =========================================================
   INFORMAÇÕES
   ========================================================= */

#status{
  position:absolute;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;

  padding:8px 16px;
  border-radius:999px;

  background:rgba(0,0,0,.72);
  border:1px solid rgba(255,255,255,.2);

  font-size:13px;
  font-weight:bold;

  backdrop-filter:blur(8px);
}

#name{
  position:absolute;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);

  z-index:20;

  min-width:170px;
  padding:10px 20px;

  text-align:center;

  background:rgba(0,0,0,.8);
  border:1px solid rgba(255,255,255,.25);
  border-radius:14px;

  font-size:18px;
  font-weight:900;

  text-shadow:0 2px 8px #000;
}

/* =========================================================
   PERSONAGEM
   ========================================================= */

#character{

  left:50%;
  bottom:62px;

  width:150px;
  height:300px;

  transform:translateX(-50%);

}

/* =========================================================
   ENTRADA
   ========================================================= */

.enter{
  animation:entrance 1.25s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes entrance{
  0%{
    transform:
      translateX(-420px)
      translateY(70px)
      rotate(-35deg)
      scale(.5);

    opacity:0;
  }

  60%{
    transform:
      translateX(35px)
      translateY(-8px)
      rotate(8deg)
      scale(1.08);

    opacity:1;
  }

  80%{
    transform:
      translateX(-12px)
      translateY(3px)
      rotate(-4deg)
      scale(.98);
  }

  100%{
    transform:
      translateX(-50%)
      translateY(0)
      rotate(0)
      scale(1);
  }
}

/* =========================================================
   DANÇAS
   ========================================================= */

/* ARANHA */

.spider.dance .body{
  animation:spiderBody .65s ease-in-out infinite alternate;
}

.spider.dance .arm.l{
  animation:spiderArmL .42s ease-in-out infinite alternate;
}

.spider.dance .arm.r{
  animation:spiderArmR .53s ease-in-out infinite alternate;
}

.spider.dance .leg.l{
  animation:spiderLegL .5s ease-in-out infinite alternate;
}

.spider.dance .leg.r{
  animation:spiderLegR .58s ease-in-out infinite alternate;
}

@keyframes spiderBody{
  from{transform:rotate(-7deg) translateY(3px)}
  to{transform:rotate(7deg) translateY(-8px)}
}

@keyframes spiderArmL{
  from{transform:rotate(-50deg)}
  to{transform:rotate(25deg)}
}

@keyframes spiderArmR{
  from{transform:rotate(50deg)}
  to{transform:rotate(-25deg)}
}

@keyframes spiderLegL{
  from{transform:rotate(15deg)}
  to{transform:rotate(-22deg)}
}

@keyframes spiderLegR{
  from{transform:rotate(-15deg)}
  to{transform:rotate(22deg)}
}

}

@keyframes hulkArmL{

<script>

/* =========================================================
   PERSONAGENS
   ========================================================= */

const personagens = {

  "homem aranha":{
    nome:"Aranha Urbano",
    classe:"spider"
  },

  "aranha urbano":{
    nome:"Aranha Urbano",
    classe:"spider"
  },

  "hulk":{
    nome:"Hulk",
    classe:"hulk"
  },

    classe:"batman"
  },

  "homem de ferro":{
    nome:"Homem de Ferro",
    classe:"iron"
  },

  "superman":{
    nome:"Superman",
    classe:"superman"
  },

  "super man":{
    nome:"Superman",
    classe:"superman"
  },

  "flash":{
    nome:"Flash",
    classe:"flash"
  },

  "capitao america":{
    nome:"Capitão América",
    classe:"cap"
  },

  "capitão américa":{
    nome:"Capitão América",
    classe:"cap"
  },

  "ninja":{
    nome:"Ninja Futurista",
    classe:"ninja"
  },

  "robo":{
    nome:"Robô Futurista",
    classe:"robot"
  },

  "robô":{
    nome:"Robô Futurista",
    classe:"robot"
  },

  "alien":{
    nome:"Alienígena",
    classe:"alien"
  },

  "mago":{
    nome:"Mago Arcano",
    classe:"mage"
  },

  "ninja sombrio":{
    nome:"Ninja Sombrio",
    classe:"darkninja"
  },

  "titan":{
    nome:"Titã Robótico",
    classe:"titan"
  },

  "titã":{
    nome:"Titã Robótico",
    classe:"titan"
  },

  "cosmico":{
    nome:"Guerreiro Cósmico",
    classe:"cosmic"
  },

  "cósmico":{
    nome:"Guerreiro Cósmico",
    classe:"cosmic"
  },

  "dragao":{
    nome:"Dragão Guerreiro",
    classe:"dragon"
  },

  "dragão":{
    nome:"Dragão Guerreiro",
    classe:"dragon"
  }

};


/* =========================================================
   PRESENTES
   ========================================================= */

const presentes = {

  "rose":"homem aranha",
  "rosa":"homem aranha",

  "lion":"hulk",
  "leao":"hulk",
  "leão":"hulk",

  "crown":"batman",
  "coroa":"batman",

  "rocket":"homem de ferro",
  "foguete":"homem de ferro",

  "heart":"superman",
  "coracao":"superman",
  "coração":"superman",

  "lightning":"flash",
  "raio":"flash",

  "shield":"capitao america",
  "escudo":"capitao america",

  "star":"mago",
  "estrela":"mago",

  "dragon":"dragao",
  "dragao":"dragao",
  "dragão":"dragao"

};


/* =========================================================
   ELEMENTOS
   ========================================================= */

const hero = document.getElementById("character");
const nameBox = document.getElementById("name");
const statusBox = document.getElementById("status");

let timerEntrada;
let timerDanca;
let timerSaida;
let timerReset;


/* =========================================================
   INICIAR PERSONAGEM
   ========================================================= */

function iniciarPorNome(nome){

  nome = String(nome)
    .toLowerCase()
    .trim();

  const personagem = personagens[nome];

  if(!personagem){

    nameBox.textContent = "Personagem não encontrado";
    return;

  }

  iniciar(personagem);

}


/* =========================================================
   ANIMAÇÃO
   ========================================================= */

function iniciar(personagem){

  clearTimeout(timerEntrada);
  clearTimeout(timerDanca);
  clearTimeout(timerSaida);
  clearTimeout(timerReset);

  hero.className = "";

  void hero.offsetWidth;

  hero.className = personagem.classe + " enter";

  nameBox.textContent = personagem.nome;

  statusBox.textContent =
    "🟢 ENTRANDO • " + personagem.nome;

  timerDanca = setTimeout(()=>{

    hero.classList.remove("enter");
    hero.classList.add("dance");

    statusBox.textContent =
      "🔥 DANÇANDO • " + personagem.nome;

  },1250);


  timerSaida = setTimeout(()=>{

    hero.classList.remove("dance");
    hero.classList.add("exit");

    statusBox.textContent =
      "🚪 SAINDO • " + personagem.nome;

  },6500);


  timerReset = setTimeout(()=>{

    hero.className = "";

    nameBox.textContent =
      "Aguardando presente...";

    statusBox.textContent =
      "🟢 LIVE STAGE • PRONTO";

  },7800);

}


/* =========================================================
   PRESENTE DO TIKTOK
   ========================================================= */

function receberPresenteTikTok(nomePresente){

  const nome = String(nomePresente)
    .toLowerCase()
    .trim();

  const personagem =
    presentes[nome];

  if(personagem){

    iniciarPorNome(personagem);

  }else{

    console.log(
      "Presente sem personagem configurado:",
      nomePresente
    );

  }

}


/* =========================================================
   TESTE AUTOMÁTICO
   ========================================================= */

window.testarPresente = function(nome){

  receberPresenteTikTok(nome);

};


/* =========================================================
   MENSAGEM INICIAL
   ========================================================= */

console.log(
  "LIVE Stage V9 carregado."
);

console.log(
  "Use iniciarPorNome('hulk') para testar."
);

console.log(
  "Use receberPresenteTikTok('rose') para testar presente."
);

</script>
