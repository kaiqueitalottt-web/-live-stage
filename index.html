<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>LIVE Stage V8 2D</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

/* =========================
   PALCO
========================= */

#stage{
  position:relative;
  height:70vh;
  min-height:470px;
  overflow:hidden;

  background:
    linear-gradient(
      rgba(0,0,0,.18),
      rgba(0,0,0,.58)
    ),
    url("fundo.jpg") center/cover no-repeat;
}

/* brilho ambiente */

#stage:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(
      circle at 50% 55%,
      rgba(255,0,70,.20),
      transparent 34%
    ),
    radial-gradient(
      circle at 15% 30%,
      rgba(0,110,255,.14),
      transparent 30%
    );
  pointer-events:none;
}

/* refletores */

.beam{
  position:absolute;
  top:-25%;
  width:18%;
  height:150%;
  opacity:.12;
  filter:blur(22px);
  transform:rotate(14deg);
  pointer-events:none;
}

.beam.blue{
  left:8%;
  background:#008cff;
}

.beam.red{
  right:8%;
  background:#ff003c;
  transform:rotate(-14deg);
}

/* =========================
   HUD
========================= */

#status{
  position:absolute;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  z-index:100;

  padding:10px 17px;
  border-radius:30px;

  background:rgba(5,5,8,.78);
  border:1px solid rgba(255,255,255,.16);

  box-shadow:
    0 8px 30px rgba(0,0,0,.35),
    inset 0 0 20px rgba(255,255,255,.03);

  font-size:13px;
  font-weight:bold;
  white-space:nowrap;
}

#name{
  position:absolute;
  left:50%;
  bottom:10%;
  transform:translateX(-50%);

  z-index:90;

  display:none;

  padding:8px 18px;
  border-radius:14px;

  background:rgba(5,5,8,.88);
  border:1px solid rgba(255,255,255,.18);

  font-weight:800;
  letter-spacing:.3px;

  box-shadow:0 5px 25px rgba(0,0,0,.45);
}

/* =========================
   PERSONAGEM 2D
========================= */

#character{
  position:absolute;

  left:50%;
  bottom:9%;

  width:190px;
  height:330px;

  z-index:50;

  display:none;

  transform-origin:center bottom;

  filter:
    drop-shadow(0 18px 16px rgba(0,0,0,.55));
}

/* sombra no chão */

#character:after{
  content:"";

  position:absolute;
  bottom:-5px;
  left:20px;

  width:150px;
  height:22px;

  border-radius:50%;

  background:rgba(0,0,0,.48);
  filter:blur(7px);

  z-index:-1;
}

/* =========================
   CORPO BASE
========================= */

.head{
  position:absolute;

  top:4px;
  left:60px;

  width:70px;
  height:76px;

  border-radius:45% 45% 48% 48%;

  z-index:6;
}

.body{
  position:absolute;

  top:72px;
  left:48px;

  width:94px;
  height:112px;

  border-radius:30px 30px 20px 20px;

  z-index:4;
}

.arm{
  position:absolute;

  top:80px;

  width:27px;
  height:112px;

  border-radius:20px;

  transform-origin:top center;

  z-index:3;
}

.arm.l{
  left:27px;
}

.arm.r{
  right:27px;
}

.leg{
  position:absolute;

  top:175px;

  width:31px;
  height:125px;

  border-radius:17px;

  transform-origin:top center;

  z-index:2;
}

.leg.l{
  left:53px;
}

.leg.r{
  right:53px;
}

/* botas */

.leg:after{
  content:"";

  position:absolute;

  bottom:-7px;
  left:-9px;

  width:49px;
  height:25px;

  border-radius:15px 20px 10px 10px;

  background:#111;
}

/* =========================
   CABEÇAS / ROSTOS
========================= */

.eye{
  position:absolute;

  top:31px;

  width:17px;
  height:10px;

  background:white;

  border-radius:80% 20%;

  z-index:20;
}

.eye.l{
  left:13px;
  transform:rotate(-18deg);
}

.eye.r{
  right:13px;
  transform:rotate(18deg);
}

/* =========================
   HOMEM ARANHA
========================= */

.spider .head{
  background:
    repeating-linear-gradient(
      25deg,
      transparent 0 9px,
      rgba(255,255,255,.22) 10px 11px
    ),
    #c40019;

  border:3px solid #111;

  clip-path:polygon(
    50% 0,
    88% 18%,
    100% 58%,
    75% 100%,
    25% 100%,
    0 58%,
    12% 18%
  );
}

.spider .eye{
  width:22px;
  height:29px;
  background:#fff;
  border:3px solid #111;
  border-radius:70% 30%;
}

.spider .body{
  background:
    linear-gradient(
      90deg,
      #b60017 0 23%,
      #111 24% 76%,
      #b60017 77%
    );

  border:3px solid #111;
}

.spider .body:after{
  content:"✦";

  position:absolute;
  left:30px;
  top:26px;

  color:#fff;
  font-size:31px;
}

.spider .arm{
  background:#c40019;
  border:3px solid #111;
}

.spider .leg{
  background:#101010;
  border:3px solid #111;
}

/* =========================
   HULK
========================= */

.hulk .head{
  background:#4c9d38;
  border:3px solid #263d20;
  border-radius:45% 45% 40% 40%;
}

.hulk .head:before{
  content:"";

  position:absolute;
  top:-12px;
  left:7px;

  width:58px;
  height:22px;

  background:#202020;

  border-radius:50% 50% 20% 20%;
}

.hulk .body{
  background:#4e963b;
  border:3px solid #263d20;

  transform:scaleX(1.18);
}

.hulk .arm{
  background:#4e963b;
  border:3px solid #263d20;

  width:34px;
  height:125px;
}

.hulk .leg{
  background:#342c48;
  border:3px solid #171322;
  width:37px;
}

/* =========================
   BATMAN
========================= */

.batman .head{
  background:#181b20;
  border:3px solid #050505;

  clip-path:polygon(
    0 25%,
    22% 0,
    35% 19%,
    50% 10%,
    65% 19%,
    78% 0,
    100% 25%,
    90% 100%,
    10% 100%
  );
}

.batman .eye{
  background:#ffe45a;
  height:7px;
}

.batman .body{
  background:#17191d;
  border:3px solid #070707;
}

.batman .body:after{
  content:"🦇";

  position:absolute;
  left:28px;
  top:30px;

  font-size:30px;
}

.batman .arm{
  background:#17191d;
  border:3px solid #070707;
}

.batman .leg{
  background:#090a0d;
  border:3px solid #050505;
}

/* capa */

.batman:before{
  content:"";

  position:absolute;

  left:28px;
  top:80px;

  width:135px;
  height:215px;

  background:
    linear-gradient(
      90deg,
      #08090b,
      #202329,
      #08090b
    );

  clip-path:polygon(
    0 0,
    100% 0,
    88% 100%,
    70% 87%,
    53% 100%,
    37% 87%,
    18% 100%
  );

  z-index:1;
}

/* =========================
   HOMEM DE FERRO
========================= */

.iron .head{
  background:
    linear-gradient(
      135deg,
      #f2c13d,
      #a80000 52%,
      #590000
    );

  border:4px solid #550000;

  border-radius:38%;
}

.iron .eye{
  background:#8ff5ff;
  box-shadow:0 0 8px #42eaff;
}

.iron .body{
  background:
    linear-gradient(
      90deg,
      #8c0000,
      #e01919,
      #8c0000
    );

  border:4px solid #f0b62c;
}

.iron .body:after{
  content:"";

  position:absolute;

  left:34px;
  top:34px;

  width:27px;
  height:27px;

  border-radius:50%;

  background:#8ff5ff;

  box-shadow:
    0 0 16px #42eaff,
    inset 0 0 8px white;
}

.iron .arm{
  background:#a50000;
  border:4px solid #f0b62c;
}

.iron .leg{
  background:#9c0000;
  border:4px solid #f0b62c;
}

/* =========================
   SUPERMAN
========================= */

.superman .head{
  background:#bd7b58;
  border:3px solid #512f24;
}

.superman .head:before{
  content:"";

  position:absolute;

  top:-8px;
  left:7px;

  width:58px;
  height:23px;

  background:#171717;

  border-radius:60% 40% 30% 20%;
  transform:rotate(-8deg);
}

.superman .body{
  background:
    linear-gradient(
      #1768c4 0 70%,
      #c31d2d 71%
    );

  border:3px solid #092d65;
}

.superman .body:after{
  content:"S";

  position:absolute;

  left:30px;
  top:18px;

  font-size:38px;
  font-weight:900;

  color:#ffd72d;
  text-shadow:1px 1px 0 #8c111c;
}

.superman .arm{
  background:#1768c4;
  border:3px solid #092d65;
}

.superman .leg{
  background:#16366a;
  border:3px solid #081a36;
}

/* =========================
   FLASH
========================= */

.flash .head{
  background:#c90000;
  border:3px solid #600000;
}

.flash .body,
.flash .arm{
  background:#d10000;
  border:3px solid #640000;
}

.flash .body:after{
  content:"⚡";

  position:absolute;

  left:29px;
  top:27px;

  font-size:35px;
  color:#ffd82e;
}

.flash .leg{
  background:#b70000;
  border:3px solid #640000;
}

/* =========================
   NINJA
========================= */

.ninja .head{
  background:#151515;
  border:4px solid #050505;
}

.ninja .head:after{
  content:"";

  position:absolute;

  left:8px;
  top:48px;

  width:54px;
  height:12px;

  background:#d8d8d8;
  opacity:.9;
}

.ninja .body{
  background:
    linear-gradient(
      135deg,
      #252525,
      #080808
    );

  border:3px solid #5b6cff;
}

.ninja .arm{
  background:#171717;
  border:3px solid #5b6cff;
}

.ninja .leg{
  background:#111;
  border:3px solid #343b65;
}

/* =========================
   ROBÔ
========================= */

.robot .head{
  background:
    linear-gradient(
      #c7d0da,
      #5c6875
    );

  border:3px solid #8df1ff;
  border-radius:18px;
}

.robot .eye{
  background:#62efff;
  box-shadow:0 0 10px #62efff;
}

.robot .body{
  background:
    linear-gradient(
      135deg,
      #9faab5,
      #303942
    );

  border:3px solid #70eaff;
  border-radius:17px;
}

.robot .body:after{
  content:"◈";

  position:absolute;

  left:34px;
  top:32px;

  color:#7cf4ff;
  font-size:29px;
}

.robot .arm,
.robot .leg{
  background:#697580;
  border:3px solid #6eeaff;
}

/* =========================
   MAGO
========================= */

.mage .head{
  background:#a56e50;
  border:3px solid #43291f;
}

.mage .body{
  background:
    linear-gradient(
      135deg,
      #6721a0,
      #21082f
    );

  border:3px solid #b96cff;
}

.mage .body:after{
  content:"✦";

  position:absolute;

  left:32px;
  top:30px;

  font-size:32px;

  color:#e8a0ff;

  text-shadow:0 0 14px #cf4dff;
}

.mage .arm,
.mage .leg{
  background:#34104f;
  border:3px solid #9c4be0;
}

/* =========================
   COSMICO
========================= */

.cosmic .head{
  background:
    radial-gradient(
      circle at 35% 30%,
      #9effff,
      #4c48bd 70%
    );

  border:3px solid #8fffff;
}

.cosmic .body{
  background:
    linear-gradient(
      135deg,
      #2637ad,
      #150633
    );

  border:3px solid #75f5ff;
}

.cosmic .body:after{
  content:"✦";

  position:absolute;
  left:32px;
  top:29px;

  color:#9effff;
  font-size:33px;

  text-shadow:
    0 0 10px #6ff,
    0 0 20px #7a5cff;
}

.cosmic .arm,
.cosmic .leg{
  background:#17227b;
  border:3px solid #5beaff;
}

/* =========================
   DRAGÃO
========================= */

.dragon .head{
  background:#b9341c;
  border:3px solid #4a1009;

  border-radius:42% 42% 35% 35%;
}

.dragon .head:before,
.dragon .head:after{
  content:"";

  position:absolute;

  top:-13px;

  width:25px;
  height:25px;

  background:#8d2514;

  clip-path:polygon(50% 0,100% 100%,0 100%);
}

.dragon .head:before{left:4px}
.dragon .head:after{right:4px}

.dragon .body,
.dragon .arm{
  background:
    linear-gradient(
      135deg,
      #c2381b,
      #55120c
    );

  border:3px solid #4a1009;
}

.dragon .body:after{
  content:"🐲";

  position:absolute;
  left:29px;
  top:28px;
  font-size:31px;
}

.dragon .leg{
  background:#64150d;
  border:3px solid #3d0b07;
}

/* =========================
   DANÇAS
========================= */

.dance{
  display:block!important;
}

/* padrão */

.dance .arm.l{
  animation:armLeft .55s infinite alternate ease-in-out;
}

.dance .arm.r{
  animation:armRight .55s infinite alternate ease-in-out;
}

.dance .leg.l{
  animation:legLeft .55s infinite alternate ease-in-out;
}

.dance .leg.r{
  animation:legRight .55s infinite alternate ease-in-out;
}

@keyframes armLeft{
  from{transform:rotate(28deg)}
  to{transform:rotate(-45deg)}
}

@keyframes armRight{
  from{transform:rotate(-28deg)}
  to{transform:rotate(45deg)}
}

@keyframes legLeft{
  from{transform:rotate(5deg)}
  to{transform:rotate(-8deg)}
}

@keyframes legRight{
  from{transform:rotate(-5deg)}
  to{transform:rotate(8deg)}
}

/* corpo dançando */

.dance{
  animation:
    bodyDance .7s infinite alternate ease-in-out;
}

@keyframes bodyDance{
  0%{
    transform:translate(-50%,0) rotate(-4deg) scale(1);
  }

  50%{
    transform:translate(-50%,-13px) rotate(3deg) scale(1.035);
  }

  100%{
    transform:translate(-50%,0) rotate(5deg) scale(1);
  }
}

/* aranha: dança acrobática */

.spider.dance{
  animation:
    spiderDance .65s infinite alternate ease-in-out;
}

@keyframes spiderDance{
  0%{
    transform:translate(-50%,0) rotate(-7deg) scale(1);
  }

  50%{
    transform:translate(-50%,-24px) rotate(7deg) scale(1.05);
  }

  100%{
    transform:translate(-50%,4px) rotate(-4deg) scale(1);
  }
}

/* Hulk: pesada */

.hulk.dance{
  animation:
    hulkDance .8s infinite alternate ease-in-out;
}

@keyframes hulkDance{
  0%{
    transform:translate(-50%,0) scale(1);
  }

  50%{
    transform:translate(-50%,-8px) scale(1.08);
  }

  100%{
    transform:translate(-50%,2px) scale(.98);
  }
}

/* Batman */

.batman.dance{
  animation:
    batDance .9s infinite alternate ease-in-out;
}

@keyframes batDance{
  0%{
    transform:translate(-50%,0) rotate(-3deg);
  }

  50%{
    transform:translate(-50%,-15px) rotate(3deg);
  }

  100%{
    transform:translate(-50%,0) rotate(-2deg);
  }
}

/* Homem de Ferro */

.iron.dance{
  animation:
    ironDance .5s infinite alternate ease-in-out;
}

@keyframes ironDance{
  0%{
    transform:translate(-50%,0) rotate(-4deg);
  }

  100%{
    transform:translate(-50%,-15px) rotate(4deg) scale(1.05);
  }
}

/* =========================
   ENTRADA
========================= */

.enter{
  display:block!important;

  animation:
    enterStage 1.35s cubic-bezier(.12,.82,.2,1) forwards;
}

@keyframes enterStage{

  0%{
    transform:
      translate(-160%,80px)
      rotate(-18deg)
      scale(.45);

    opacity:0;
  }

  55%{
    transform:
      translate(-45%,-8px)
      rotate(6deg)
      scale(1.07);

    opacity:1;
  }

  75%{
    transform:
      translate(-53%,4px)
      rotate(-3deg)
      scale(.98);
  }

  100%{
    transform:
      translate(-50%,0)
      rotate(0)
      scale(1);

    opacity:1;
  }
}

/* =========================
   SAÍDA
========================= */

.exit{
  display:block!important;

  animation:
    exitStage 1.25s cubic-bezier(.65,0,.9,.25) forwards;
}

@keyframes exitStage{

  0%{
    transform:
      translate(-50%,0)
      rotate(0)
      scale(1);

    opacity:1;
  }

  35%{
    transform:
      translate(-42%,-20px)
      rotate(-5deg)
      scale(1.04);
  }

  100%{
    transform:
      translate(155%,45px)
      rotate(18deg)
      scale(.55);

    opacity:0;
  }
}

/* =========================
   CONTROLES
========================= */

#controls{
  padding:14px;

  display:flex;
  gap:8px;

  background:#050505;
}

#cmd{
  flex:1;
  min-width:0;

  padding:14px;

  color:white;
  background:#111;

  border:1px solid #303030;
  border-radius:13px;

  outline:none;
}

#cmd:focus{
  border-color:#7448ff;
}

button{
  border:0;
  border-radius:12px;

  padding:0 16px;

  background:
    linear-gradient(
      90deg,
      #6825ff,
      #ff1744
    );

  color:white;

  font-weight:bold;
}

/* =========================
   BOTÕES
========================= */

#tests{
  padding:12px;

  display:flex;
  flex-wrap:wrap;
  gap:7px;

  background:#050505;
}

.test{
  padding:9px 11px;

  border-radius:9px;

  background:#151515;

  border:1px solid #292929;

  font-size:12px;
}

/* =========================
   QUADRADOS PRETOS
========================= */

#boxes{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;

  padding:12px;

  background:#000;
}

.box{
  height:100px;

  background:#000;

  border:
    1px solid #1b1b1b;

  border-radius:12px;
}

/* =========================
   CELULAR
========================= */

@media(max-width:600px){

  #stage{
    height:67vh;
    min-height:430px;
  }

  #character{
    transform:
      translateX(-50%)
      scale(.78);
  }

  .test{
    font-size:11px;
  }

  #status{
    font-size:12px;
  }
}
</style>
</head>

<body>

<div id="stage">

  <div class="beam blue"></div>
  <div class="beam red"></div>

  <div id="status">
    🟢 LIVE Stage pronto
  </div>

  <div id="name"></div>

  <div id="character">

    <div class="head">
      <span class="eye l"></span>
      <span class="eye r"></span>
    </div>

    <div class="body"></div>

    <div class="arm l"></div>
    <div class="arm r"></div>

    <div class="leg l"></div>
    <div class="leg r"></div>

  </div>

</div>


<div id="controls">

  <input
    id="cmd"
    placeholder="Digite um personagem..."
  >

  <button onclick="testar()">
    TESTAR
  </button>

</div>


<div id="tests">

  <button class="test"
    onclick="iniciarPorNome('homem aranha')">
    🕷️ Aranha
  </button>

  <button class="test"
    onclick="iniciarPorNome('hulk')">
    💚 Hulk
  </button>

  <button class="test"
    onclick="iniciarPorNome('batman')">
    🦇 Batman
  </button>

  <button class="test"
    onclick="iniciarPorNome('homem de ferro')">
    🤖 Homem de Ferro
  </button>

  <button class="test"
    onclick="iniciarPorNome('superman')">
    🦸 Superman
  </button>

  <button class="test"
    onclick="iniciarPorNome('flash')">
    ⚡ Flash
  </button>

  <button class="test"
    onclick="iniciarPorNome('ninja')">
    🥷 Ninja
  </button>

  <button class="test"
    onclick="iniciarPorNome('robo')">
    🤖 Robô
  </button>

  <button class="test"
    onclick="iniciarPorNome('mago')">
    🧙 Mago
  </button>

  <button class="test"
    onclick="iniciarPorNome('cosmico')">
    🌌 Cósmico
  </button>

  <button class="test"
    onclick="iniciarPorNome('dragao')">
    🐲 Dragão
  </button>

</div>


<div id="boxes">

  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>

</div>


<script>

/* =========================
   PERSONAGENS
========================= */

const personagens={

  "homem aranha":{
    nome:"Aranha Urbano",
    classe:"spider"
  },

  "aranha urbano":{
    nome:"Aranha Urbano",
    classe:"spider"
  },

  "hulk":{
    nome:"Hulk",
    classe:"hulk"

/* =========================
   NORMALIZAÇÃO
========================= */

function normalizar(texto){

  return texto
    .toLowerCase()
    .trim()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");

}


/* =========================
   TESTE
========================= */

function testar(){

  const valor=
    document.getElementById("cmd").value;

  iniciarPorNome(valor);

  document.getElementById("cmd").value="";
}


/* =========================
   INICIAR
========================= */

let ocupado=false;

function iniciarPorNome(valor){

  const chave=normalizar(valor);

  const personagem=
    personagens[chave];

  if(!personagem){

    document.getElementById("status").textContent=
      "❌ Personagem não encontrado";

    return;
  }

  iniciar(personagem);
}


/* =========================
   SEQUÊNCIA
========================= */

function iniciar(personagem){

  if(ocupado){

    document.getElementById("status").textContent=
      "⏳ O palco está ocupado";

    return;
  }

  ocupado=true;

  const hero=
    document.getElementById("character");

  const name=
    document.getElementById("name");

  const status=
    document.getElementById("status");


  /* limpar animações */

  hero.className="";

  void hero.offsetWidth;


  /* nome */

  name.textContent=
    personagem.nome;

  name.style.display="block";


  /* ENTRADA */

  hero.className=
    personagem.classe+" enter";

  status.textContent=
    "🚪 "+personagem.nome+
    " entrou no palco";


  /* DANÇA */

  setTimeout(()=>{

    hero.className=
      personagem.classe+" dance";

    status.textContent=
      "🔥 "+personagem.nome+
      " está dançando!";

  },1400);


  /* SAÍDA */

  setTimeout(()=>{

    hero.className=
      personagem.classe+" exit";

    status.textContent=
      "🚪 "+personagem.nome+
      " está saindo...";

  },6500);


  /* RESET */

  setTimeout(()=>{

    hero.style.display="none";

    hero.className=
      personagem.classe;

    name.style.display="none";

    status.textContent=
      "🟢 LIVE Stage pronto";

    ocupado=false;

  },7800);

}

/* =========================
   EVENTO DE PRESENTE
========================= */

function receberPresenteTikTok(nomePresente){

  const chave=
    normalizar(nomePresente);

  const personagem=
    presentes[chave];

  if(!personagem){

    document.getElementById("status").textContent=
      "🎁 Presente recebido: "+
      nomePresente;

    return;
  }

  iniciarPorNome(personagem);

}


/* ENTER */

document
  .getElementById("cmd")
  .addEventListener(
    "keydown",
    e=>{
      if(e.key==="Enter") testar();
