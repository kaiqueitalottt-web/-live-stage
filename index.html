<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>LIVE Stage V4</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}
#stage{
  position:relative;
  height:70vh;
  min-height:460px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 30%,rgba(0,130,255,.18),transparent 35%),
    linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.55)),
    url("fundo.jpg") center/cover no-repeat;
}
/* iluminação */
.beam{
  position:absolute;
  top:-20%;
  width:22%;
  height:130%;
  opacity:.13;
  filter:blur(20px);
  transform:rotate(12deg);
  pointer-events:none;
}
.beam.blue{left:10%;background:#008cff}
.beam.red{right:10%;background:#ff003c;transform:rotate(-12deg)}
#status{
  position:absolute;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  z-index:50;
  padding:9px 16px;
  border-radius:20px;
  background:rgba(0,0,0,.72);
  border:1px solid rgba(255,255,255,.15);
  font-size:13px;
  white-space:nowrap;
}
#name{
  position:absolute;
  left:50%;
  bottom:8%;
  transform:translateX(-50%);
  z-index:40;
  padding:7px 16px;
  border-radius:12px;
  background:rgba(0,0,0,.82);
  font-weight:bold;
  display:none;
}
/* personagem */
#character{
  position:absolute;
  left:50%;
  bottom:10%;
  width:150px;
  height:290px;
  z-index:20;
  display:none;
  transform-origin:center bottom;
}
.part{
  position:absolute;
  border-radius:25px;
}
.head{
  left:43px;
  top:0;
  width:64px;
  height:70px;
  border-radius:45%;
}
.body{
  left:35px;
  top:62px;
  width:80px;
  height:105px;
  border-radius:25px;
}
.arm{
  top:70px;
  width:22px;
  height:105px;
  border-radius:20px;
}
.arm.l{left:13px}
.arm.r{right:13px}
.leg{
  top:157px;
  width:27px;
  height:120px;
  border-radius:20px;
}
.leg.l{left:39px}
.leg.r{right:39px}
.eye{
  position:absolute;
  top:27px;
  width:20px;
  height:11px;
  background:white;
  border-radius:50%;
  z-index:5;
}
.eye.l{left:12px;transform:rotate(-18deg)}
.eye.r{right:12px;transform:rotate(18deg)}
/* visuais */
.spider .head,.spider .body,.spider .arm,.spider .leg{
  background:linear-gradient(135deg,#111,#55000c);
  border:2px solid #e00022;
}
.spider .body:after{
  content:"✦";
  position:absolute;
  left:28px;
  top:27px;
  font-size:28px;
  color:#e00022;
}
.hulk .head,.hulk .body,.hulk .arm{
  background:linear-gradient(135deg,#4a9638,#214d25);
}
.hulk .leg{background:#292929}
.batman .head,.batman .body,.batman .arm,.batman .leg{
  background:linear-gradient(135deg,#292929,#050505);
}
.batman .body:after{
  content:"🦇";
  position:absolute;
  left:22px;
  top:28px;
  font-size:30px;
}
.iron .head,.iron .body,.iron .arm,.iron .leg{
  background:linear-gradient(135deg,#a90000,#f0b800);
}
.iron .body{border:3px solid #ffd84d}
.superman .head{background:#c98d68}
.superman .body{
  background:linear-gradient(#1760ba,#103a78);
  border:3px solid #d61e2c;
}
.superman .arm{background:#1760ba}
.superman .leg{background:#172642}
.superman .body:after{
  content:"S";
  position:absolute;
  left:27px;
  top:25px;
  font-size:36px;
  font-weight:bold;
  color:#ffd51a;
}
.flash .head,.flash .body,.flash .arm,.flash .leg{
  background:linear-gradient(135deg,#d90000,#710000);
}
.flash .body:after{
  content:"⚡";
  position:absolute;
  left:28px;
  top:30px;
  font-size:28px;
  color:#ffd800;
}
.cap .head{background:#c98d68}
.cap .body,.cap .arm{background:#174c91}
.cap .leg{background:#202b45}
.cap .body:after{
  content:"★";
  position:absolute;
  left:28px;
  top:28px;
  color:white;
  font-size:32px;
}
.ninja .head{background:#171717}
.ninja .body,.ninja .arm,.ninja .leg{
  background:linear-gradient(135deg,#202020,#050505);
}
.ninja .body:after{
  content:"✦";
  position:absolute;
  left:29px;
  top:28px;
  color:#6c7cff;
  font-size:25px;
}
.robot .head,.robot .body,.robot .arm,.robot .leg{
  background:linear-gradient(135deg,#aeb8c5,#39424c);
  border:2px solid #7de7ff;
}
.robot .body:after{
  content:"◈";
  position:absolute;
  left:28px;
  top:30px;
  color:#7de7ff;
  font-size:28px;
}
.alien .head{
  background:linear-gradient(135deg,#79ff89,#137d42);
}
.alien .body,.alien .arm,.alien .leg{
  background:#17633d;
}
.mage .head{background:#6d4b3c}
.mage .body,.mage .arm,.mage .leg{
  background:linear-gradient(135deg,#4c1b79,#170629);
}
.mage .body:after{
  content:"✦";
  position:absolute;
  left:28px;
  top:28px;
  color:#d88cff;
  font-size:30px;
}
.darkninja .head,.darkninja .body,.darkninja .arm,.darkninja .leg{
  background:linear-gradient(135deg,#111,#020202);
}
.darkninja .body:after{
  content:"☠";
  position:absolute;
  left:28px;
  top:29px;
  font-size:27px;
  color:#b600ff;
}
.titan .head,.titan .body,.titan .arm,.titan .leg{
  background:linear-gradient(135deg,#596273,#151a25);
  border:2px solid #b7c5ff;
}
.cosmic .head{
  background:linear-gradient(135deg,#77e6ff,#4a42b9);
}
.cosmic .body,.cosmic .arm,.cosmic .leg{
  background:linear-gradient(135deg,#2438a8,#170b48);
}
.cosmic .body:after{
  content:"✦";
  position:absolute;
  left:27px;
  top:28px;
  color:#8ffaff;
  font-size:30px;
}
.dragon .head,.dragon .body,.dragon .arm,.dragon .leg{
  background:linear-gradient(135deg,#b52a18,#48100b);
}
.dragon .body:after{
  content:"🐲";
  position:absolute;
  left:22px;
  top:27px;
  font-size:30px;
}
/* animações */
.enter{
  display:block!important;
  animation:enter 1.25s cubic-bezier(.18,.82,.18,1) forwards;
}
@keyframes enter{
  0%{
    transform:translate(-160%,35px) scale(.45);
    opacity:0;
  }
  65%{
    transform:translate(-45%,0) scale(1.04);
    opacity:1;
  }
  100%{
    transform:translate(-50%,0) scale(1);
    opacity:1;
  }
}
.dance{
  display:block!important;
  animation:dance .48s infinite alternate ease-in-out;
}
@keyframes dance{
  0%{transform:translate(-50%,0) rotate(-5deg)}
  50%{transform:translate(-50%,-12px) rotate(4deg) scale(1.04)}
  100%{transform:translate(-50%,0) rotate(6deg)}
}
.exit{
  display:block!important;
  animation:exit 1.25s cubic-bezier(.7,0,.9,.2) forwards;
}
@keyframes exit{
  0%{
    transform:translate(-50%,0) scale(1);
    opacity:1;
  }
  100%{
    transform:translate(150%,25px) scale(.55);
    opacity:0;
  }
}
/* controles */
#controls{
  padding:14px;
  display:flex;
  gap:8px;
  background:#050505;
}
#cmd{
  flex:1;
  min-width:0;
  padding:14px;
  color:white;
  background:#111;
  border:1px solid #333;
  border-radius:12px;
}
button{
  border:0;
  border-radius:12px;
  padding:0 16px;
  background:linear-gradient(90deg,#6b22ff,#ff1744);
  color:white;
  font-weight:bold;
}
#boxes{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  padding:12px;
  background:#000;
}
.box{
  height:100px;
  background:#000;
  border:1px solid #202020;
  border-radius:12px;
}
#tests{
  padding:12px;
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  background:#050505;
}
.test{
  padding:9px 11px;
  border-radius:9px;
  background:#151515;
  border:1px solid #292929;
  font-size:12px;
}
@media(max-width:600px){
  #stage{height:66vh;min-height:420px}
  #character{transform:translateX(-50%) scale(.78)}
  .test{font-size:11px}
}
</style>
</head>
<body>
<div id="stage">
  <div class="beam blue"></div>
  <div class="beam red"></div>
  <div id="status">🟢 LIVE Stage pronto</div>
  <div id="name"></div>
  <div id="character">
    <div class="part head">
      <span class="eye l"></span>
      <span class="eye r"></span>
    </div>
    <div class="part body"></div>
    <div class="part arm l"></div>
    <div class="part arm r"></div>
    <div class="part leg l"></div>
    <div class="part leg r"></div>
  </div>
</div>
<div id="controls">
  <input id="cmd" placeholder="Digite um personagem...">
  <button onclick="testar()">TESTAR</button>
</div>
<div id="tests">
  <button class="test" onclick="iniciarPorNome('homem aranha')">🕷️ Aranha</button>
  <button class="test" onclick="iniciarPorNome('hulk')">💚 Hulk</button>
  <button class="test" onclick="iniciarPorNome('batman')">🦇 Batman</button>
  <button class="test" onclick="iniciarPorNome('homem de ferro')">🤖 Homem de Ferro</button>
  <button class="test" onclick="iniciarPorNome('superman')">🦸 Superman</button>
  <button class="test" onclick="iniciarPorNome('flash')">⚡ Flash</button>
  <button class="test" onclick="iniciarPorNome('capitao america')">🛡️ Capitão</button>
  <button class="test" onclick="iniciarPorNome('ninja')">🥷 Ninja</button>
  <button class="test" onclick="iniciarPorNome('robo')">🤖 Robô</button>
  <button class="test" onclick="iniciarPorNome('alien')">👽 Alien</button>
  <button class="test" onclick="iniciarPorNome('mago')">🧙 Mago</button>
  <button class="test" onclick="iniciarPorNome('ninja sombrio')">🥷 Sombrio</button>
  <button class="test" onclick="iniciarPorNome('titan')">🤖 Titã</button>
  <button class="test" onclick="iniciarPorNome('cosmico')">👽 Cósmico</button>
  <button class="test" onclick="iniciarPorNome('dragao')">🐲 Dragão</button>
</div>
<div id="boxes">
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>
</div>
<script>
const personagens={
  "homem aranha":{nome:"Aranha Urbano",classe:"spider"},
  "aranha urbano":{nome:"Aranha Urbano",classe:"spider"},
  "hulk":{nome:"Hulk",classe:"hulk"},
  "batman":{nome:"Batman",classe:"batman"},
  "homem de ferro":{nome:"Homem de Ferro",classe:"iron"},
  "superman":{nome:"Superman",classe:"superman"},
  "super man":{nome:"Superman",classe:"superman"},
  "flash":{nome:"Flash",classe:"flash"},
  "capitao america":{nome:"Capitão América",classe:"cap"},
  "ninja":{nome:"Ninja Futurista",classe:"ninja"},
  "robo":{nome:"Robô Futurista",classe:"robot"},
  "alien":{nome:"Alienígena",classe:"alien"},
  "mago":{nome:"Mago Arcano",classe:"mage"},
  "ninja sombrio":{nome:"Ninja Sombrio",classe:"darkninja"},
  "titan":{nome:"Titã Robótico",classe:"titan"},
  "cosmico":{nome:"Alienígena Cósmico",classe:"cosmic"},
  "dragao":{nome:"Dragão Guerreiro",classe:"dragon"}
};
let ocupado=false;
function normalizar(texto){
  return texto
    .toLowerCase()
    .trim()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");
}
function testar(){
  const valor=document.getElementById("cmd").value;
  iniciarPorNome(valor);
  document.getElementById("cmd").value="";
}
function iniciarPorNome(valor){
  const chave=normalizar(valor);
  const personagem=personagens[chave];
  if(!personagem){
    document.getElementById("status").textContent=
      "❌ Personagem não encontrado";
    return;
  }
  iniciar(personagem);
}
function iniciar(personagem){
  if(ocupado){
    document.getElementById("status").textContent=
      "⏳ O palco está ocupado";
    return;
  }
  ocupado=true;
  const hero=document.getElementById("character");
  const name=document.getElementById("name");
  const status=document.getElementById("status");
  hero.className=personagem.classe+" enter";
  name.textContent=personagem.nome;
  name.style.display="block";
  status.textContent=
    "🚪 "+personagem.nome+" entrou no palco";
  setTimeout(()=>{
    hero.className=personagem.classe+" dance";
    status.textContent=
      "💃 "+personagem.nome+" está dançando!";
  },1400);
  setTimeout(()=>{
    hero.className=personagem.classe+" exit";
    status.textContent=
      "🚪 "+personagem.nome+" está saindo...";
  },6000);
  setTimeout(()=>{
    hero.style.display="none";
    hero.className=personagem.classe;
    name.style.display="none";
    status.textContent="🟢 LIVE Stage pronto";
    ocupado=false;
  },7300);
}
/*
  ==================================================
  INTERFACE PARA O WORKER / TIKTOK
  ==================================================
  O Worker poderá chamar este endpoint da página
  quando receber um evento autorizado.
  Exemplo de evento interno:
  {
    "type":"gift",
    "gift":"rose"
  }
  O mapeamento abaixo pode ser alterado depois.
*/
const presentes={
  "rose":"homem aranha",
  "rosa":"homem aranha",
  "lion":"hulk",
  "leao":"hulk",
  "crown":"batman",
  "coroa":"batman",
  "rocket":"homem de ferro",
  "foguete":"homem de ferro",
  "heart":"superman",
  "coracao":"superman",
  "lightning":"flash",
  "raio":"flash",
  "shield":"capitao america",
  "escudo":"capitao america",
  "star":"mago",
  "estrela":"mago",
  "dragon":"dragao",
  "dragao":"dragao"
};
function receberPresenteTikTok(nomePresente){
  const chave=normalizar(nomePresente);
  const personagem=presentes[chave];
  if(!personagem){
    document.getElementById("status").textContent=
      "🎁 Presente recebido: "+nomePresente;
    return;
  }
  iniciarPorNome(personagem);
}
/*
  Para teste local:
  receberPresenteTikTok("rosa");
  Isso faz o Aranha Urbano entrar.
  Quando a integração oficial estiver pronta,
  o Worker poderá enviar os eventos para esta lógica.
*/
document.getElementById("cmd").addEventListener(
  "keydown",
  e=>{
    if(e.key==="Enter") testar();
  }
);
</script>
</body>
</html>
