<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVE Stage V4</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

/* =========================
   PALCO
========================= */

#stage{
  position:relative;
  height:72vh;
  min-height:500px;
  overflow:hidden;

  background-image:
    linear-gradient(
      rgba(0,0,0,.12),
      rgba(0,0,0,.12)
    ),
    url("fundo.jpg");

  background-size:cover;
  background-position:center;
}

/* Luzes do palco */

.light{
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  filter:blur(25px);
  opacity:.18;
  pointer-events:none;
}

.l1{
  left:8%;
  top:12%;
  background:#00aaff;
}

.l2{
  right:10%;
  top:15%;
  background:#ff003c;
}

.l3{
  left:45%;
  top:5%;
  background:#ffffff;
}

/* =========================
   PERSONAGEM
========================= */

#character{
  position:absolute;
  left:50%;
  bottom:10%;
  transform:translateX(-50%);

  width:150px;
  height:280px;

  display:none;
  z-index:10;
}

/* cabeça */

.head{
  position:absolute;
  top:0;
  left:42px;

  width:66px;
  height:72px;

  border-radius:45% 45% 48% 48%;
}

/* olhos */

.eye{
  position:absolute;
  top:27px;
  width:20px;
  height:12px;
  background:white;
  border-radius:50%;
  z-index:3;
}

.eye.left{
  left:13px;
  transform:rotate(-20deg);
}

.eye.right{
  right:13px;
  transform:rotate(20deg);
}

/* corpo */

.body{
  position:absolute;
  top:65px;
  left:37px;

  width:76px;
  height:105px;

  border-radius:25px 25px 18px 18px;
}

/* braços */

.arm{
  position:absolute;
  top:75px;
  width:20px;
  height:100px;
  border-radius:20px;
}

.arm.left{
  left:15px;
  transform:rotate(15deg);
}

.arm.right{
  right:15px;
  transform:rotate(-15deg);
}

/* pernas */

.leg{
  position:absolute;
  top:160px;
  width:27px;
  height:105px;
  border-radius:20px;
}

.leg.left{
  left:40px;
  transform:rotate(4deg);
}

.leg.right{
  right:40px;
  transform:rotate(-4deg);
}

/* =========================
   VISUAL DOS PERSONAGENS
========================= */

/* ARANHA */

.spider .head,
.spider .body,
.spider .arm,
.spider .leg{
  background:#111;
  border:2px solid #d90020;
}

.spider .head:after{
  content:"✦";
  position:absolute;
  left:25px;
  top:15px;
  color:#e00025;
  font-size:25px;
}

.spider .body:after{
  content:"🕷";
  position:absolute;
  left:20px;
  top:30px;
  font-size:30px;
}

/* HULK */

.hulk .head,
.hulk .body,
.hulk .arm,
.hulk .leg{
  background:#4d9b38;
}

.hulk .body{
  width:90px;
  left:30px;
}

.hulk .arm{
  width:27px;
  height:110px;
}

.hulk .leg{
  background:#222;
}

/* BATMAN */

.batman .head,
.batman .body,
.batman .arm,
.batman .leg{
  background:#181818;
}

.batman .head:before{
  content:"";
  position:absolute;
  top:-15px;
  left:5px;
  width:55px;
  height:25px;
  background:#181818;
  clip-path:polygon(
    0 100%,15% 0,35% 70%,
    50% 10%,65% 70%,85% 0,100% 100%
  );
}

.batman .body:after{
  content:"🦇";
  position:absolute;
  top:25px;
  left:20px;
  font-size:30px;
}

/* HOMEM DE FERRO */

.iron .head,
.iron .body,
.iron .arm,
.iron .leg{
  background:linear-gradient(135deg,#b50000,#e6b400);
}

.iron .head{
  border:3px solid #ffd84d;
}

.iron .body{
  border:3px solid #ffd84d;
}

/* SUPERMAN */

.superman .head{
  background:#d69b72;
}

.superman .body{
  background:#1555a5;
  border:3px solid #d91e27;
}

.superman .arm,
.superman .leg{
  background:#1555a5;
}

.superman .leg{
  background:#18233c;
}

.superman .body:after{
  content:"S";
  position:absolute;
  left:25px;
  top:25px;

  color:#ffd51a;
  font-size:35px;
  font-weight:bold;
}

/* =========================
   ANIMAÇÕES
========================= */

.enter{
  display:block !important;
  animation:enter 1.2s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes enter{
  from{
    transform:
      translate(-50%,180px)
      scale(.4);
    opacity:0;
  }

  to{
    transform:
      translate(-50%,0)
      scale(1);
    opacity:1;
  }
}

.dance{
  display:block !important;
  animation:
    dance .42s infinite alternate ease-in-out;
}

@keyframes dance{
  from{
    transform:
      translate(-50%,0)
      rotate(-6deg)
      scale(1);
  }

  to{
    transform:
      translate(-50%,-18px)
      rotate(6deg)
      scale(1.05);
  }
}

.exit{
  display:block !important;
  animation:exit 1.1s ease-in forwards;
}

@keyframes exit{
  from{
    transform:
      translate(-50%,0)
      scale(1);
    opacity:1;
  }

  to{
    transform:
      translate(130%,0)
      scale(.5);
    opacity:0;
  }
}

/* =========================
   NOME
========================= */

#name{
  position:absolute;
  left:50%;
  bottom:4%;
  transform:translateX(-50%);

  padding:8px 18px;

  background:rgba(0,0,0,.8);
  border:1px solid #777;
  border-radius:12px;

  font-size:18px;
  font-weight:bold;

  display:none;
  z-index:20;
}

/* =========================
   STATUS
========================= */

#status{
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);

  padding:10px 20px;

  background:rgba(0,0,0,.75);
  border-radius:20px;

  font-weight:bold;
  z-index:30;
}

/* =========================
   PARTE INFERIOR
========================= */

#controls{
  background:#000;
  padding:25px;
  display:flex;
  justify-content:center;
}

#controls input{
  width:60%;
  max-width:500px;

  padding:16px;

  background:#111;
  color:white;

  border:1px solid #444;
  border-radius:12px 0 0 12px;

  font-size:16px;
}

#controls button{
  padding:16px 25px;

  border:0;
  border-radius:0 12px 12px 0;

  background:linear-gradient(90deg,#6b22ff,#ff1744);
  color:white;

  font-weight:bold;
  cursor:pointer;
}

/* =========================
   3 QUADRADOS PRETOS
========================= */

#boxes{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;

  padding:20px;
  background:#000;
}

.box{
  height:140px;
  background:#050505;
  border:1px solid #222;
  border-radius:15px;
}

/* celular */

@media(max-width:700px){

  #stage{
    height:65vh;
    min-height:420px;
    background-position:center;
  }

  #character{
    transform:translateX(-50%) scale(.75);
    transform-origin:bottom center;
  }

  #name{
    bottom:6%;
    font-size:15px;
  }

  #controls{
    padding:15px;
  }

  #controls input{
    width:70%;
  }

  #boxes{
    gap:8px;
    padding:10px;
  }

  .box{
    height:100px;
  }
}
</style>
</head>

<body>

<div id="stage">

  <div class="light l1"></div>
  <div class="light l2"></div>
  <div class="light l3"></div>

  <div id="status">
    🟢 Pronto para começar
  </div>

  <div id="name"></div>

  <div id="character">

    <div class="head">
      <span class="eye left"></span>
      <span class="eye right"></span>
    </div>

    <div class="body"></div>

    <div class="arm left"></div>
    <div class="arm right"></div>

    <div class="leg left"></div>
    <div class="leg right"></div>

  </div>

</div>

<div id="controls">

  <input
    id="cmd"
    placeholder="Digite: homem aranha, hulk, batman..."
  >

  <button onclick="entrar()">
    ENTRAR
  </button>

</div>

<div id="boxes">
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>
</div>


<script>

let ocupado = false;

const personagens = {

  "homem aranha":{
    nome:"Aranha Urbano",
    classe:"spider"
  },

  "homem-aranha":{
    nome:"Aranha Urbano",
    classe:"spider"
  },

  "aranha urbano":{
    nome:"Aranha Urbano",
    classe:"spider"
  },

  "hulk":{
    nome:"Hulk",
    classe:"hulk"
  },

  "batman":{
    nome:"Batman",
    classe:"batman"
  },

  "homem de ferro":{
    nome:"Homem de Ferro",
    classe:"iron"
  },

  "homem-de-ferro":{
    nome:"Homem de Ferro",
    classe:"iron"
  },

  "super man":{
    nome:"Superman",
    classe:"superman"
  },

  "superman":{
    nome:"Superman",
    classe:"superman"
  }

};


function entrar(){

  if(ocupado){
    document.getElementById("status").textContent =
      "⏳ O palco está ocupado!";
    return;
  }

  let comando =
    document.getElementById("cmd")
    .value
    .toLowerCase()
    .trim();

  let personagem = personagens[comando];

  if(!personagem){

    document.getElementById("status").textContent =
      "❌ Personagem não encontrado";

    return;
  }

  iniciar(personagem);

  document.getElementById("cmd").value="";
}


function iniciar(personagem){

  ocupado=true;

  const hero =
    document.getElementById("character");

  const name =
    document.getElementById("name");

  const status =
    document.getElementById("status");


  /* personagem */

  hero.className =
    personagem.classe;

  name.textContent =
    personagem.nome;

  name.style.display="block";


  /* reinicia animação */

  hero.className =
    personagem.classe + " enter";


  status.textContent =
    "🚪 " + personagem.nome + " está entrando...";


  /* DANÇA */

  setTimeout(function(){

    hero.className =
      personagem.classe + " dance";

    status.textContent =
      "💃 " + personagem.nome + " está dançando!";

  },1500);


  /* SAÍDA */

  setTimeout(function(){

    hero.className =
      personagem.classe + " exit";

    status.textContent =
      "🚪 " + personagem.nome + " está saindo...";

  },6000);


  /* FINAL */

  setTimeout(function(){

    hero.className =
      personagem.classe;

    hero.style.display="none";

    name.style.display="none";

    status.textContent =
      "🟢 Pronto para começar";

    ocupado=false;

  },7200);

}


/* ENTER DO TECLADO */

document
.getElementById("cmd")
.addEventListener("keydown",function(event){

  if(event.key==="Enter"){
    entrar();
  }

});

</script>

</body>
</html>
