<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>LIVE Stage V8 • 3D</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

body{
  background:
    radial-gradient(circle at 50% 0%,#15151d 0,#000 45%);
}

/* =========================
   PALCO
========================= */

#stage{
  position:relative;
  width:100%;
  height:72vh;
  min-height:500px;
  overflow:hidden;

  background:
    linear-gradient(
      rgba(0,0,0,.15),
      rgba(0,0,0,.58)
    ),
    url("fundo.jpg") center/cover no-repeat;

  border-bottom:1px solid #25252b;
}

/* brilho cinematográfico */

#stage:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
    radial-gradient(
      ellipse at center 55% 65%,
      rgba(255,0,55,.18),
      transparent 42%
    ),
    radial-gradient(
      ellipse at center 35% 20%,
      rgba(0,100,255,.12),
      transparent 35%
    );
}

/* =========================
   LUZES
========================= */

.beam{
  position:absolute;
  top:-30%;
  width:18%;
  height:170%;
  opacity:.16;
  filter:blur(22px);
  pointer-events:none;
  transform-origin:top center;
  mix-blend-mode:screen;
}

.beam.blue{
  left:12%;
  background:linear-gradient(
    to bottom,
    rgba(0,130,255,.9),
    transparent
  );
  transform:rotate(18deg);
  animation:lightMove 4s ease-in-out infinite alternate;
}

.beam.red{
  right:12%;
  background:linear-gradient(
    to bottom,
    rgba(255,0,45,.9),
    transparent
  );
  transform:rotate(-18deg);
  animation:lightMove2 4.7s ease-in-out infinite alternate;
}

@keyframes lightMove{
  from{transform:rotate(10deg)}
  to{transform:rotate(25deg)}
}

@keyframes lightMove2{
  from{transform:rotate(-10deg)}
  to{transform:rotate(-25deg)}
}

/* =========================
   STATUS
========================= */

#status{
  position:absolute;
  top:16px;
  left:50%;
  transform:translateX(-50%);

  z-index:100;

  padding:10px 18px;
  border-radius:999px;

  background:rgba(5,5,8,.78);
  backdrop-filter:blur(14px);

  border:1px solid rgba(255,255,255,.15);

  box-shadow:
    0 8px 30px rgba(0,0,0,.35);

  font-size:13px;
  font-weight:bold;
  white-space:nowrap;
}

/* =========================
   NOME
========================= */

#name{
  position:absolute;
  left:50%;
  bottom:11%;
  transform:translateX(-50%);

  z-index:100;

  padding:9px 18px;

  border-radius:14px;

  background:rgba(0,0,0,.78);
  border:1px solid rgba(255,255,255,.18);

  backdrop-filter:blur(12px);

  font-size:15px;
  font-weight:800;

  display:none;

  box-shadow:
    0 10px 35px rgba(0,0,0,.5);
}

/* =========================
   CONTAINER 3D
========================= */

#character3d{
  position:absolute;
  inset:0;
  z-index:30;

  pointer-events:none;

  opacity:0;
}

#character3d canvas{
  display:block;
  width:100%!important;
  height:100%!important;
}

/* =========================
   EFEITO ENTRADA
========================= */

#character3d.enter{
  animation:
    characterEnter 1.25s cubic-bezier(.16,.9,.2,1)
    forwards;
}

@keyframes characterEnter{

  0%{
    opacity:0;
    transform:
      translateX(-45vw)
      translateY(50px)
      scale(.65);
  }

  60%{
    opacity:1;
    transform:
      translateX(25px)
      translateY(-8px)
      scale(1.05);
  }

  100%{
    opacity:1;
    transform:
      translateX(0)
      translateY(0)
      scale(1);
  }
}

/* =========================
   DANÇA
========================= */

#character3d.dance{
  opacity:1;
  animation:
    danceBody .48s ease-in-out infinite alternate;
}

@keyframes danceBody{

  0%{
    transform:
      translateY(0)
      rotate(-2deg)
      scale(1);
  }

  50%{
    transform:
      translateY(-13px)
      rotate(3deg)
      scale(1.025);
  }

  100%{
    transform:
      translateY(0)
      rotate(-3deg)
      scale(1);
  }
}

/* =========================
   SAÍDA
========================= */

#character3d.exit{
  opacity:1;

  animation:
    characterExit 1.25s cubic-bezier(.7,0,.9,.2)
    forwards;
}

@keyframes characterExit{

  0%{
    opacity:1;
    transform:
      translateX(0)
      translateY(0)
      scale(1);
  }

  100%{
    opacity:0;
    transform:
      translateX(48vw)
      translateY(30px)
      scale(.65);
  }
}

/* =========================
   CONTROLES
========================= */

#controls{
  padding:13px;

  display:flex;
  gap:8px;

  background:
    linear-gradient(#070709,#030303);

  border-bottom:1px solid #17171b;
}

#cmd{
  flex:1;
  min-width:0;

  padding:14px 15px;

  border-radius:13px;

  background:#111216;
  color:white;

  border:1px solid #303139;
  outline:none;

  font-size:14px;
}

#cmd:focus{
  border-color:#8b3dff;
  box-shadow:0 0 0 3px rgba(130,50,255,.12);
}

button{
  border:0;
  color:white;

  font-weight:800;

  cursor:pointer;

  transition:
    transform .15s,
    filter .15s;
}

button:active{
  transform:scale(.95);
}

/* =========================
   BOTÃO TESTAR
========================= */

#mainTest{
  padding:0 18px;

  border-radius:13px;

  background:
    linear-gradient(
      100deg,
      #6b25ff,
      #e40042
    );

  box-shadow:
    0 8px 25px rgba(105,20,255,.22);
}

/* =========================
   TESTES
========================= */

#tests{
  padding:12px;

  display:flex;
  flex-wrap:wrap;
  gap:7px;

  background:#050506;
}

.test{
  padding:9px 11px;

  border-radius:10px;

  background:#121317;

  border:1px solid #292a30;

  font-size:12px;
}

.test:hover{
  filter:brightness(1.3);
}

/* =========================
   3 QUADRADOS
========================= */

#boxes{
  display:grid;
  grid-template-columns:
    repeat(3,1fr);

  gap:10px;

  padding:12px;

  background:#000;
}

.box{
  height:100px;

  background:#000;

  border:1px solid #1c1c21;

  border-radius:13px;

  box-shadow:
    inset 0 0 20px rgba(255,255,255,.015);
}

/* =========================
   CELULAR
========================= */

@media(max-width:600px){

  #stage{
    height:67vh;
    min-height:430px;
  }

  #status{
    top:12px;
    font-size:11px;
    padding:8px 13px;
  }

  #name{
    bottom:9%;
    font-size:13px;
  }

  #controls{
    padding:10px;
  }

  #cmd{
    font-size:13px;
  }

  #mainTest{
    padding:0 13px;
  }

  .test{
    font-size:11px;
  }

  .box{
    height:82px;
  }
}
</style>
</head>

<body>

<!-- =========================
     PALCO
========================= -->

<div id="stage">

  <div class="beam blue"></div>
  <div class="beam red"></div>

  <div id="status">
    🟢 LIVE Stage • Pronto
  </div>

  <div id="name"></div>

  <div id="character3d"></div>

</div>


<!-- =========================
     CONTROLE
========================= -->

<div id="controls">

  <input
    id="cmd"
    autocomplete="off"
    placeholder="Digite um personagem..."
  >

  <button
    id="mainTest"
    onclick="testar()">
    TESTAR
  </button>

</div>


<!-- =========================
     PERSONAGENS
========================= -->

<div id="tests">

  <button class="test"
    onclick="iniciarPorNome('homem aranha')">
    🕷️ Aranha
  </button>

  <button class="test"
    onclick="iniciarPorNome('hulk')">
    💚 Hulk
  </button>

  <button class="test"
    onclick="iniciarPorNome('batman')">
    🦇 Batman
  </button>

  <button class="test"
    onclick="iniciarPorNome('homem de ferro')">
    🤖 Homem de Ferro
  </button>

  <button class="test"
    onclick="iniciarPorNome('superman')">

  </button>

  <button class="test"
    onclick="iniciarPorNome('flash')">

  </button>

  <button class="test"
    onclick="iniciarPorNome('capitao america')">
    🛡️ Capitão
  </button>

  <button class="test"
    onclick="iniciarPorNome('ninja')">

  </button>

  <button class="test"
    onclick="iniciarPorNome('robo')">
    🤖 Robô
  </button>

  <button class="test"
    onclick="iniciarPorNome('alien')">
    👽 Alien
  </button>

  <button class="test"

  <button class="test"
    onclick="iniciarPorNome('ninja sombrio')">
    🌑 Ninja Sombrio
  </button>

  <button class="test"
    onclick="iniciarPorNome('titan')">
    🦾 Titã
  </button>

  <button class="test"
    onclick="iniciarPorNome('cosmico')">

  <button class="test"
    onclick="iniciarPorNome('dragao')">

  </button>

</div>


<!-- =========================
     3 QUADRADOS PRETOS
========================= -->

<div id="boxes">

  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>

</div>


<!-- =========================
     THREE.JS
========================= -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const personagens = {

  "homem aranha":{
    nome:"Aranha Urbano",
    tipo:"spider"
  },

  "aranha urbano":{
    nome:"Aranha Urbano",
    tipo:"spider"
  },

  "hulk":{
    nome:"Hulk",
    tipo:"hulk"
  },

  "batman":{
    nome:"Batman",
    tipo:"batman"
  },

  "homem de ferro":{
    nome:"Homem de Ferro",
    tipo:"iron"
  },

  "superman":{
    nome:"Superman",
    tipo:"superman"
  },

  "super man":{
    nome:"Superman",
    tipo:"superman"
  },

  "flash":{
    nome:"Flash",
    tipo:"flash"
  },

  "capitao america":{
    nome:"Capitão América",
    tipo:"captain"
  },

  "ninja":{
    nome:"Ninja Futurista",
    tipo:"ninja"
  },

  "robo":{
    nome:"Robô Futurista",
    tipo:"robot"
  },

  "alien":{
    nome:"Alienígena",
    tipo:"alien"
  },

  "mago":{
    nome:"Mago Arcano",
    tipo:"mage"
  },

  "ninja sombrio":{
    nome:"Ninja Sombrio",
    tipo:"darkninja"
  },

  "titan":{
    nome:"Titã Robótico",
    tipo:"titan"
  },

  "cosmico":{
    nome:"Guerreiro Cósmico",
    tipo:"cosmic"
  },

  "dragao":{
    nome:"Dragão Guerreiro",
    tipo:"dragon"
  }

};


/* =====================================================
   PRESENTES → PERSONAGENS
===================================================== */

const presentes = {

  "rose":"homem aranha",
  "rosa":"homem aranha",

  "lion":"hulk",
  "leao":"hulk",

  "crown":"batman",
  "coroa":"batman",

  "rocket":"homem de ferro",
  "foguete":"homem de ferro",

  "heart":"superman",
  "coracao":"superman",

  "lightning":"flash",
  "raio":"flash",

  "shield":"capitao america",
  "escudo":"capitao america",

  "star":"mago",
  "estrela":"mago",

  "dragon":"dragao",
  "dragao":"dragao",

  "ninja":"ninja",
  "alien":"alien",

  "robot":"robo",
  "robo":"robo"
};


/* =====================================================
   THREE
===================================================== */

let scene;
let camera;
let renderer;
let personagemAtual;

let ocupado=false;

let clock;

const container =
  document.getElementById("character3d");


/* =====================================================
   INICIAR 3D
===================================================== */

function iniciar3D(){

  scene =
    new THREE.Scene();

  camera =
    new THREE.PerspectiveCamera(
      35,
      window.innerWidth /
      window.innerHeight,
      .1,
      100
    );

  camera.position.set(
    0,
    2.2,
    7
  );


  renderer =
    new THREE.WebGLRenderer({
      antialias:true,
      alpha:true
    });

  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      2
    )
  );

  renderer.setSize(
    window.innerWidth,
    document.getElementById("stage").clientHeight
  );

  renderer.shadowMap.enabled=true;

  container.appendChild(
    renderer.domElement
  );


  /* iluminação */

  const ambient =
    new THREE.HemisphereLight(
      0xffffff,
      0x202030,
      2
    );

  scene.add(ambient);


  const key =
    new THREE.DirectionalLight(
      0xffffff,
      4
    );

  key.position.set(
    3,
    7,
    5
  );

  key.castShadow=true;

  scene.add(key);


  const red =
    new THREE.PointLight(
      0xff003c,
      35,
      12
    );

  red.position.set(
    -4,
    3,
    2
  );

  scene.add(red);


  const blue =
    new THREE.PointLight(
      0x168cff,
      35,
      12
    );

  blue.position.set(
    4,
    3,
    2
  );

  scene.add(blue);


  clock =
    new THREE.Clock();


  window.addEventListener(
    "resize",
    redimensionar
  );


  animar();
}


/* =====================================================
   MATERIAL
===================================================== */

function material(cor,metal=0){

  return new THREE.MeshStandardMaterial({

    color:cor,

    roughness:
      metal ? .25 : .55,

    metalness:
      metal ? .75 : .05
  });
}


/* =====================================================
   CRIAR PERSONAGEM
===================================================== */

function criarPersonagem(tipo){

  const grupo =
    new THREE.Group();

  grupo.position.y=-2.25;


  let cores;


  switch(tipo){

    case"spider":

      cores={
        corpo:0x090909,
        detalhe:0xb40020,
        pele:0x111111
      };

    break;


    case"hulk":

      cores={
        corpo:0x4c9b3c,
        detalhe:0x552a79,
        pele:0x5aaa43
      };

    break;


    case"batman":

      cores={
        corpo:0x111318,
        detalhe:0x24262c,
        pele:0x9b694f
      };

    break;


    case"iron":

      cores={
        corpo:0xa50012,
        detalhe:0xffc400,
        pele:0x202020
      };

    break;


    case"superman":

      cores={
        corpo:0x1761ba,
        detalhe:0xd7192d,
        pele:0xb87959
      };

    break;


    case"flash":

      cores={
        corpo:0xc90015,
        detalhe:0xffc400,
        pele:0x9b624c
      };

    break;


    case"captain":

      cores={
        corpo:0x174b8d,
        detalhe:0xcfcfcf,
        pele:0xb87858
      };

    break;


    case"ninja":

      cores={
        corpo:0x15171d,
        detalhe:0x4e70ff,
        pele:0x171717
      };

    break;


    case"robot":

      cores={
        corpo:0x778493,
        detalhe:0x6eeaff,
        pele:0x9ba8b5
      };

    break;


    case"alien":

      cores={
        corpo:0x187c48,
        detalhe:0x7dff8d,
        pele:0x73ff91
      };

    break;


    case"mage":

      cores={
        corpo:0x47127b,
        detalhe:0xd76cff,
        pele:0x725040
      };

    break;


    case"darkninja":

      cores={
        corpo:0x050505,
        detalhe:0xa800ff,
        pele:0x111111
      };

    break;


    case"titan":

      cores={
        corpo:0x4c5668,
        detalhe:0xb9c7ff,
        pele:0x77818f
      };

    break;


    case"cosmic":

      cores={
        corpo:0x202e9d,
        detalhe:0x77f7ff,
        pele:0x5fcfff
      };

    break;


    case"dragon":

      cores={
        corpo:0x7e160d,
        detalhe:0xff5425,
        pele:0xb72a18
      };

    break;


    default:

      cores={
        corpo:0x333333,
        detalhe:0xffffff,
        pele:0xb87959
      };
  }


  /* =========================
     CORPO
  ========================= */

  const corpo =
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        .55,
        1.25,
        8,
        16
      ),
      material(
        cores.corpo,
        tipo==="iron"||
        tipo==="robot"||
        tipo==="titan"
      )
    );

  corpo.position.y=1.65;

  corpo.scale.z=.65;

  corpo.castShadow=true;

  grupo.add(corpo);


  /* =========================
     CABEÇA
  ========================= */

  const cabeca =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .43,
        24,
        24
      ),
      material(
        cores.pele,
        tipo==="robot"||
        tipo==="titan"
      )
    );

  cabeca.position.y=2.75;

  cabeca.castShadow=true;

  grupo.add(cabeca);


  /* =========================
     BRAÇOS
  ========================= */

  const bracoGeo =
    new THREE.CapsuleGeometry(
      .16,
      .85,
      6,
      12
    );


  const bracoL =
    new THREE.Mesh(
      bracoGeo,
      material(cores.corpo)
    );

  bracoL.position.set(
    -.72,
    1.7,
    0
  );

  bracoL.rotation.z=-.18;

  grupo.add(bracoL);


  const bracoR =
    new THREE.Mesh(
      bracoGeo,
      material(cores.corpo)
    );

  bracoR.position.set(
    .72,
    1.7,
    0
  );

  bracoR.rotation.z=.18;

  grupo.add(bracoR);


  /* =========================
     PERNAS
  ========================= */

  const pernaGeo =
    new THREE.CapsuleGeometry(
      .19,
      1.05,
      6,
      12
    );


  const pernaL =
    new THREE.Mesh(
      pernaGeo,
      material(cores.corpo)
    );

  pernaL.position.set(
    -.3,
    .55,
    0
  );

  grupo.add(pernaL);


  const pernaR =
    new THREE.Mesh(
      pernaGeo,
      material(cores.corpo)
    );

  pernaR.position.set(
    .3,
    .55,
    0
  );

  grupo.add(pernaR);


  /* =========================
     DETALHE NO PEITO
  ========================= */

  const detalhe =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .38,
        .38,
        .08
      ),
      material(
        cores.detalhe,
        1
      )
    );

  detalhe.position.set(
    0,
    1.75,
    -.39
  );

  grupo.add(detalhe);


  /* =========================
     OLHOS
  ========================= */

  if(tipo!=="hulk" &&
     tipo!=="alien"){

    const olhoMat =
      material(0xffffff,1);

    const olhoGeo =
      new THREE.SphereGeometry(
        .075,
        12,
        12
      );


    const olhoL =
      new THREE.Mesh(
        olhoGeo,
        olhoMat
      );

    olhoL.position.set(
      -.16,
      2.83,
      -.39
    );

    grupo.add(olhoL);


    const olhoR =
      new THREE.Mesh(
        olhoGeo,
        olhoMat
      );

    olhoR.position.set(
      .16,
      2.83,
      -.39
    );

    grupo.add(olhoR);
  }


  /* =========================
     CAPA
  ========================= */

  if(tipo==="batman"||
     tipo==="superman"){

    const capa =
      new THREE.Mesh(
        new THREE.PlaneGeometry(
          1.7,
          2.2
        ),
        new THREE.MeshStandardMaterial({
          color:
            tipo==="batman"
            ?0x050505
            :0x9b0718,

          side:
            THREE.DoubleSide,

          roughness:.7
        })
      );

    capa.position.set(
      0,
      1.55,
      .35
    );

    capa.rotation.x=.12;

    grupo.add(capa);
  }


  /* =========================
     ANEL DE ENERGIA
  ========================= */

  const ring =
    new THREE.Mesh(

      new THREE.TorusGeometry(
        .8,
        .025,
        8,
        64
      ),

      new THREE.MeshBasicMaterial({
        color:cores.detalhe
      })
    );

  ring.position.y=.03;

  ring.rotation.x=
    Math.PI/2;

  grupo.add(ring);


  return grupo;
}


/* =====================================================
   TROCAR PERSONAGEM
===================================================== */

function mostrarPersonagem(tipo){

  if(personagemAtual){

    scene.remove(
      personagemAtual
    );
  }

  personagemAtual =
    criarPersonagem(tipo);

  scene.add(
    personagemAtual
  );
}


/* =====================================================
   ANIMAÇÃO 3D
===================================================== */

function animar(){

  requestAnimationFrame(
    animar
  );

  const tempo =
    clock.getElapsedTime();


  if(personagemAtual){

    /* movimento natural */

    personagemAtual.rotation.y =
      Math.sin(tempo*.9)*.12;


    if(
      personagemAtual.userData.dancando
    ){

      personagemAtual.position.y =
        -2.25 +
        Math.abs(
          Math.sin(tempo*5)
        )*.16;

      personagemAtual.rotation.z =
        Math.sin(tempo*5)*.07;
    }


    /* entrada */

    if(
      personagemAtual.userData.entrando
    ){

      personagemAtual.rotation.y =
        tempo*3;
    }
  }


  renderer.render(
    scene,
    camera
  );
}


/* =====================================================
   INICIAR SHOW
===================================================== */

function iniciar(personagem){

  if(ocupado){

    document.getElementById(
      "status"
    ).textContent=
      "⏳ O palco está ocupado";

    return;
  }

  ocupado=true;


  const status =
    document.getElementById(
      "status"
    );

  const name =
    document.getElementById(
      "name"
    );


  mostrarPersonagem(
    personagem.tipo
  );


  personagemAtual
    .userData
    .entrando=true;


  personagemAtual
    .userData
    .dancando=false;


  name.textContent =
    personagem.nome;

  name.style.display =
    "block";


  container.className=
    "enter";


  status.textContent=
    "🚪 "+personagem.nome+
    " entrando no palco...";


  /* entrada */

  setTimeout(()=>{

    if(!personagemAtual)
      return;

    personagemAtual
      .userData
      .entrando=false;

    personagemAtual
      .userData
      .dancando=true;

    container.className=
      "dance";

    status.textContent=
      "🔥 "+personagem.nome+
      " está dançando!";

  },1400);


  /* dança */

  setTimeout(()=>{

    if(!personagemAtual)
      return;

    personagemAtual
      .userData
      .dancando=false;

    container.className=
      "exit";

    status.textContent=
      "🚪 "+personagem.nome+
      " está saindo...";

  },6500);


  /* fim */

  setTimeout(()=>{

    container.className="";

    container.style.opacity="0";

    name.style.display="none";

    status.textContent=
      "🟢 LIVE Stage • Pronto";

    if(personagemAtual){

      scene.remove(
        personagemAtual
      );

      personagemAtual=null;
    }

    ocupado=false;

  },7800);
}


/* =====================================================
   BUSCAR
===================================================== */

function normalizar(texto){

  return texto
    .toLowerCase()
    .trim()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    );
}


function iniciarPorNome(valor){

  const chave =
    normalizar(valor);

  const personagem =
    personagens[chave];


  if(!personagem){

    document.getElementById(
      "status"
    ).textContent=
      "❌ Personagem não encontrado";

    return;
  }


  iniciar(personagem);
}


function testar(){

  const campo =
    document.getElementById(
      "cmd"
    );

  iniciarPorNome(
    campo.value
  );

  campo.value="";
}


/* =====================================================
   TIKTOK — PRESENTES
===================================================== */

function receberPresenteTikTok(
  nomePresente
){

  const chave =
    normalizar(
      nomePresente
    );

  const personagemNome =
    presentes[chave];


  if(!personagemNome){

    document.getElementById(
      "status"
    ).textContent=
      "🎁 Presente recebido: "+
      nomePresente;

    return;
  }


  iniciarPorNome(
    personagemNome
  );
}


/* =====================================================
   TESTE DE PRESENTES
===================================================== */

/*

Exemplos:

receberPresenteTikTok("rosa");

receberPresenteTikTok("leao");

receberPresenteTikTok("coroa");

receberPresenteTikTok("foguete");

receberPresenteTikTok("coracao");

*/

document
  .getElementById("cmd")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key==="Enter"){
        testar();
      }

    }
  );


/* =====================================================
   REDIMENSIONAR
===================================================== */

function redimensionar(){

  const stage =
    document.getElementById(
      "stage"
    );

  camera.aspect =
    window.innerWidth /
    stage.clientHeight;

  camera.updateProjectionMatrix();


  renderer.setSize(
    window.innerWidth,
    stage.clientHeight
  );
}
