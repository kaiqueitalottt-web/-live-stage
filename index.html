<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1">

<title>LIVE Stage V8 — 2D</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#020205;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

body{
  background:
    radial-gradient(circle at 50% 10%,#17172a 0,#030307 45%,#000 100%);
}

/* =========================
   PALCO
========================= */

#stage{
  position:relative;
  width:100%;
  height:72vh;
  min-height:500px;
  overflow:hidden;

  background:
    radial-gradient(
      ellipse at 50% 45%,
      rgba(100,50,255,.25),
      transparent 45%
    ),
    linear-gradient(
      rgba(0,0,0,.15),
      rgba(0,0,0,.72)
    ),
    url("fundo.jpg") center/cover no-repeat;
}

/* brilho do palco */

.stageGlow{
  position:absolute;
  left:50%;
  bottom:-30%;
  width:75%;
  height:70%;
  transform:translateX(-50%);
  background:radial-gradient(
    ellipse,
    rgba(255,30,80,.35),
    rgba(100,30,255,.12),
    transparent 70%
  );
  filter:blur(25px);
}

/* =========================
   LUZES
========================= */

.light{
  position:absolute;
  top:-30%;
  width:18%;
  height:150%;
  filter:blur(18px);
  opacity:.22;
  pointer-events:none;
  transform-origin:top;
  animation:swingLight 5s ease-in-out infinite alternate;
}

.light.blue{
  left:5%;
  background:linear-gradient(
    rgba(0,140,255,.8),
    transparent 75%
  );
  transform:rotate(18deg);
}

.light.red{
  right:5%;
  background:linear-gradient(
    rgba(255,20,50,.75),
    transparent 75%
  );
  transform:rotate(-18deg);
  animation-delay:-2s;
}

.light.white{
  left:41%;
  width:18%;
  background:linear-gradient(
    rgba(255,255,255,.55),
    transparent 70%
  );
  animation-duration:6s;
}

@keyframes swingLight{
  from{
    transform:rotate(-12deg);
  }
  to{
    transform:rotate(12deg);
  }
}

/* =========================
   STATUS
========================= */

#status{
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:100;

  padding:10px 18px;

  border:1px solid rgba(255,255,255,.18);
  border-radius:30px;

  background:rgba(5,5,10,.78);
  backdrop-filter:blur(12px);

  font-size:13px;
  font-weight:bold;
  white-space:nowrap;

  box-shadow:
    0 8px 30px rgba(0,0,0,.4);
}

/* =========================
   NOME
========================= */

#name{
  position:absolute;
  left:50%;
  bottom:17%;
  transform:translateX(-50%);
  z-index:80;

  padding:8px 20px;

  border-radius:14px;

  background:rgba(0,0,0,.78);
  border:1px solid rgba(255,255,255,.18);

  font-size:15px;
  font-weight:800;

  box-shadow:
    0 0 25px rgba(255,30,80,.25);

  display:none;
}

/* =========================
   ÁREA DO PERSONAGEM
========================= */

#character{
  position:absolute;

  left:50%;
  bottom:8%;

  width:230px;
  height:390px;

  z-index:50;

  display:none;

  transform-origin:center bottom;

  filter:
    drop-shadow(0 18px 20px rgba(0,0,0,.65))
    drop-shadow(0 0 18px rgba(255,30,80,.25));
}

/* SVG */

#character svg{
  width:100%;
  height:100%;
  overflow:visible;
}

/* =========================
   ENTRADA CINEMATOGRÁFICA
========================= */

.enter{
  display:block!important;

  animation:
    entrance 1.35s
    cubic-bezier(.12,.85,.15,1)
    forwards;
}

@keyframes entrance{

  0%{
    opacity:0;
    transform:
      translate(-160%,70px)
      scale(.35)
      rotate(-15deg);
  }

  45%{
    opacity:1;
    transform:
      translate(-70%,0)
      scale(1.08)
      rotate(6deg);
  }

  72%{
    transform:
      translate(-43%,0)
      scale(.97)
      rotate(-2deg);
  }

  100%{
    opacity:1;
    transform:
      translate(-50%,0)
      scale(1)
      rotate(0);
  }
}

/* =========================
   DANÇA
========================= */

.dance{
  display:block!important;

  animation:
    danceBody .52s
    ease-in-out
    infinite alternate;
}

@keyframes danceBody{

  0%{
    transform:
      translate(-50%,0)
      rotate(-4deg)
      scale(1);
  }

  25%{
    transform:
      translate(-50%,-13px)
      rotate(5deg)
      scale(1.025);
  }

  50%{
    transform:
      translate(-50%,0)
      rotate(-5deg)
      scale(.98);
  }

  75%{
    transform:
      translate(-50%,-18px)
      rotate(4deg)
      scale(1.035);
  }

  100%{
    transform:
      translate(-50%,0)
      rotate(-3deg)
      scale(1);
  }
}

/* =========================
   SAÍDA
========================= */

.exit{
  display:block!important;

  animation:
    exitStage 1.3s
    cubic-bezier(.7,0,.95,.25)
    forwards;
}

@keyframes exitStage{

  0%{
    opacity:1;
    transform:
      translate(-50%,0)
      scale(1)
      rotate(0);
  }

  35%{
    transform:
      translate(-45%,-20px)
      scale(1.05)
      rotate(-4deg);
  }

  100%{
    opacity:0;
    transform:
      translate(150%,50px)
      scale(.5)
      rotate(12deg);
  }
}

/* =========================
   CONTROLES
========================= */

#controls{
  display:flex;
  gap:9px;

  padding:15px;

  background:
    linear-gradient(#09090e,#030305);

  border-top:1px solid #191922;
}

#cmd{
  flex:1;
  min-width:0;

  padding:15px;

  color:#fff;

  background:#101016;

  border:
    1px solid #292936;

  border-radius:13px;

  outline:none;

  font-size:14px;
}

#cmd:focus{
  border-color:#8b4dff;

  box-shadow:
    0 0 0 3px rgba(120,50,255,.12);
}

button{
  border:0;
  color:#fff;

  font-weight:800;

  border-radius:13px;

  cursor:pointer;
}

#controls button{
  padding:0 20px;

  background:
    linear-gradient(
      135deg,
      #6b25ff,
      #e91e63
    );

  box-shadow:
    0 7px 20px rgba(100,30,255,.25);
}

/* =========================
   BOTÕES
========================= */

#tests{
  display:flex;
  flex-wrap:wrap;
  gap:8px;

  padding:14px;

  background:#050507;
}

.test{
  padding:10px 13px;

  background:#111117;

  border:1px solid #252531;

  font-size:12px;

  transition:.2s;
}

.test:active{
  transform:scale(.94);
}

.test:hover{
  border-color:#7a43ff;
  background:#181321;
}

/* =========================
   QUADRADOS
========================= */

#boxes{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;

  padding:12px;

  background:#000;
}

.box{
  height:105px;

  background:#000;

  border:
    1px solid #17171d;

  border-radius:13px;
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width:600px){

  #stage{
    height:68vh;
    min-height:460px;
  }

  #character{
    width:205px;
    height:350px;
  }

  #name{
    bottom:16%;
  }

  #status{
    font-size:12px;
    max-width:90%;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .test{
    font-size:11px;
  }
}
</style>
</head>

<!-- CONTROLES -->

  <button class="test"
    onclick="iniciarPorNome('homem aranha')">

<script>

/* =========================================
   PERSONAGENS
========================================= */

const personagens = {

  "homem aranha":{
    nome:"Aranha Urbano",
    tipo:"spider"
  },

  "aranha urbano":{
    nome:"Aranha Urbano",
    tipo:"spider"
  },

  "hulk":{
    nome:"Hulk",
    tipo:"hulk"
  },

  "batman":{
    nome:"Batman",
    tipo:"batman"
  },

  "homem de ferro":{
    nome:"Homem de Ferro",
    tipo:"iron"
  },

  "superman":{
    nome:"Superman",
    tipo:"superman"
  },

  "super man":{
    nome:"Superman",
    tipo:"superman"
  },

  "flash":{
    nome:"Flash",
    tipo:"flash"
  },

  "ninja":{
    nome:"Ninja",
    tipo:"ninja"
  },

  "mago":{
    nome:"Mago Arcano",
    tipo:"mage"
  },

  "robo":{
    nome:"Robô Futurista",
    tipo:"robot"
  },

  "alien":{
    nome:"Alienígena",
    tipo:"alien"
  },

  "dragao":{
    nome:"Dragão Guerreiro",
    tipo:"dragon"
  },

  "samurai":{
    nome:"Samurai Neon",
    tipo:"samurai"
  }

};

let ocupado=false;


/* =========================================
   NORMALIZAR TEXTO
========================================= */

function normalizar(texto){

  return texto
    .toLowerCase()
    .trim()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");

}


/* =========================================
   TESTE
========================================= */

function testar(){

  const campo=document.getElementById("cmd");

  iniciarPorNome(campo.value);

  campo.value="";

}


/* =========================================
   INICIAR POR NOME
========================================= */

function iniciarPorNome(valor){

  const chave=normalizar(valor);

  const personagem=personagens[chave];

  if(!personagem){

    document.getElementById("status").textContent=
      "❌ Personagem não encontrado";

    return;
  }

  iniciar(personagem);

}


/* =========================================
   INICIAR PERSONAGEM
========================================= */

function iniciar(personagem){

  if(ocupado){

    document.getElementById("status").textContent=
      "⏳ Aguarde o personagem terminar";

    return;
  }

  ocupado=true;

  const hero=
    document.getElementById("character");

  const name=
    document.getElementById("name");

  const status=
    document.getElementById("status");


  /* troca aparência */

  aplicarVisual(personagem.tipo);


  name.textContent=personagem.nome;

  name.style.display="block";


  /* ENTRADA */

  hero.className="";

  void hero.offsetWidth;

  hero.classList.add("enter");

  status.textContent=
    "🚪 "+personagem.nome+
    " entrando no palco";


  /* DANÇA */

  setTimeout(()=>{

    hero.className="";

    void hero.offsetWidth;

    hero.classList.add("dance");

    status.textContent=
      "🔥 "+personagem.nome+
      " está DANÇANDO!";

  },1400);


  /* SAÍDA */

  setTimeout(()=>{

    hero.className="";

    void hero.offsetWidth;

    hero.classList.add("exit");

    status.textContent=
      "🚪 "+personagem.nome+
      " saindo do palco...";

  },6500);


  /* RESET */

  setTimeout(()=>{

    hero.style.display="none";

    hero.className="";

    name.style.display="none";

    status.textContent=
      "🟢 LIVE Stage pronto";

    ocupado=false;

  },7900);

}


/* =========================================
   VISUAL 2D
========================================= */

function aplicarVisual(tipo){

  const svg=document.querySelector("#character svg");

  /* mantém o desenho principal,
     mas muda a paleta */

  if(tipo==="hulk"){

    svg.style.filter=
      "hue-rotate(55deg) saturate(1.5)";

  }

  else if(tipo==="batman"){

    svg.style.filter=
      "grayscale(1) brightness(.55)";

  }

  else if(tipo==="iron"){

    svg.style.filter=
      "hue-rotate(-25deg) saturate(1.7)";

  }

  else if(tipo==="superman"){

    svg.style.filter=
      "hue-rotate(15deg) saturate(1.45)";

  }

  else if(tipo==="flash"){

    svg.style.filter=
      "hue-rotate(-15deg) saturate(1.9)";

  }

  else if(tipo==="ninja"){

    svg.style.filter=
      "brightness(.45) saturate(1.5)";

  }

  else if(tipo==="mage"){

    svg.style.filter=
      "hue-rotate(70deg) saturate(1.6)";

  }

  else if(tipo==="robot"){

    svg.style.filter=
      "grayscale(.65) brightness(1.15)";

  }

  else if(tipo==="alien"){

    svg.style.filter=
      "hue-rotate(90deg) saturate(1.8)";

  }

  else if(tipo==="dragon"){

    svg.style.filter=
      "hue-rotate(-30deg) saturate(2)";

  }

  else if(tipo==="samurai"){

    svg.style.filter=
      "hue-rotate(160deg) saturate(1.6)";

  }

  else{

    svg.style.filter="none";

  }

}


/* =========================================
   ENTER NO TECLADO
========================================= */

document
.getElementById("cmd")
.addEventListener("keydown",function(e){

  if(e.key==="Enter"){
    testar();
  }

});


/* =========================================
   SISTEMA DE PRESENTES
   PREPARADO PARA A INTEGRAÇÃO
========================================= */

const presentes={

  "rose":"homem aranha",

  "rosa":"homem aranha",

  "lion":"hulk",

  "leao":"hulk",

  "crown":"batman",

  "coroa":"batman",

  "rocket":"homem de ferro",

  "foguete":"homem de ferro",

  "heart":"superman",

  "coracao":"superman",

  "lightning":"flash",

  "raio":"flash",

  "star":"mago",

  "estrela":"mago",

  "dragon":"dragao",

  "dragao":"dragao"

};


/* =========================================
   RECEBER PRESENTE
========================================= */

function receberPresenteTikTok(nomePresente){

  const chave=
    normalizar(nomePresente);

  const personagem=
    presentes[chave];

  if(!personagem){

    document.getElementById("status").textContent=
      "🎁 Presente recebido: "+
      nomePresente;

    return;
  }

  iniciarPorNome(personagem);

}


/* TESTE:

receberPresenteTikTok("rosa");

*/

</script>

</body>
</html>
