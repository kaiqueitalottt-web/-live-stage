<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>LIVE STAGE 3D</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow-x:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:
    radial-gradient(circle at 50% 0%,#171722,#000 55%);
}

#stage{
  position:relative;
  width:100%;
  height:70vh;
  min-height:480px;
  overflow:hidden;

  background:
    linear-gradient(
      rgba(0,0,0,.05),
      rgba(0,0,0,.55)
    ),
    url("fundo.jpg") center/cover no-repeat;
}

/* brilho cinematográfico */

#stage:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
    radial-gradient(
      ellipse at 50% 80%,
      rgba(255,0,60,.18),
      transparent 42%
    ),
    radial-gradient(
      ellipse at 50% 20%,
      rgba(0,110,255,.15),
      transparent 40%
    );

  z-index:3;
}

/* luzes */

.light{
  position:absolute;
  width:18%;
  height:160%;
  top:-35%;
  opacity:.17;
  filter:blur(25px);
  transform-origin:top center;
  z-index:2;
  pointer-events:none;
}

.light.blue{
  left:8%;
  background:linear-gradient(
    to bottom,
    #008cff,
    transparent
  );
  transform:rotate(18deg);
  animation:beamBlue 4s infinite alternate ease-in-out;
}

.light.red{
  right:8%;
  background:linear-gradient(
    to bottom,
    #ff003c,
    transparent
  );
  transform:rotate(-18deg);
  animation:beamRed 4.5s infinite alternate ease-in-out;
}

@keyframes beamBlue{
  from{transform:rotate(10deg)}
  to{transform:rotate(27deg)}
}

@keyframes beamRed{
  from{transform:rotate(-10deg)}
  to{transform:rotate(-27deg)}
}

/* status */

#status{
  position:absolute;
  top:15px;
  left:50%;
  transform:translateX(-50%);

  z-index:50;

  padding:9px 16px;
  border-radius:30px;

  background:rgba(0,0,0,.72);
  border:1px solid rgba(255,255,255,.15);

  backdrop-filter:blur(15px);

  font-size:12px;
  font-weight:bold;

  white-space:nowrap;
}

/* nome */

#name{
  position:absolute;
  bottom:9%;
  left:50%;
  transform:translateX(-50%);

  z-index:50;

  padding:9px 18px;

  border-radius:14px;

  background:rgba(0,0,0,.78);
  border:1px solid rgba(255,255,255,.2);

  backdrop-filter:blur(12px);

  font-size:14px;
  font-weight:900;

  display:none;
}

/* 3D */

#character{
  position:absolute;
  inset:0;
  z-index:20;

  opacity:0;

  pointer-events:none;
}

#character canvas{
  display:block;
  width:100%!important;
  height:100%!important;
}

/* entrada */

.enter{
  animation:enter 1.2s cubic-bezier(.15,.9,.2,1) forwards;
}

@keyframes enter{

  0%{
    opacity:0;
    transform:
      translateX(-42vw)
      scale(.65)
      rotate(-12deg);
  }

  60%{
    opacity:1;
    transform:
      translateX(25px)
      scale(1.06)
      rotate(4deg);
  }

  100%{
    opacity:1;
    transform:
      translateX(0)
      scale(1)
      rotate(0);
  }
}

/* dança */

.dance{
  opacity:1;
  animation:dance .55s infinite alternate ease-in-out;
}

@keyframes dance{

  0%{
    transform:
      translateY(0)
      rotate(-3deg)
      scale(1);
  }

  50%{
    transform:
      translateY(-15px)
      rotate(3deg)
      scale(1.035);
  }

  100%{
    transform:
      translateY(0)
      rotate(-4deg)
      scale(1);
  }
}

/* saída */

.exit{
  opacity:1;
  animation:exit 1.15s cubic-bezier(.7,0,.9,.2) forwards;
}

@keyframes exit{

  0%{
    opacity:1;
    transform:
      translateX(0)
      scale(1);
  }

  100%{
    opacity:0;
    transform:
      translateX(48vw)
      scale(.65)
      rotate(12deg);
  }
}

/* controles */

#controls{
  display:flex;
  gap:8px;
  padding:12px;

  background:#050505;
  border-bottom:1px solid #191919;
}

#cmd{
  flex:1;
  min-width:0;

  padding:14px;

  border-radius:13px;

  background:#111;
  color:white;

  border:1px solid #303030;
  outline:none;
}

#cmd:focus{
  border-color:#743cff;
}

#test{
  padding:0 18px;

  border:0;
  border-radius:13px;

  color:white;
  font-weight:900;

  background:
    linear-gradient(
      100deg,
      #7027ff,
      #f00045
    );
}

/* botões */

#tests{
  display:flex;
  flex-wrap:wrap;
  gap:7px;

  padding:12px;

  background:#050505;
}

.test{
  border:1px solid #292929;
  border-radius:10px;

  background:#121212;
  color:white;

  padding:9px 11px;

  font-size:12px;
  font-weight:bold;
}

/* caixas */

#boxes{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;

  padding:12px;

  background:#000;
}

.box{
  height:90px;

  background:#000;

  border:1px solid #1c1c1c;
  border-radius:13px;
}

@media(max-width:600px){

  #stage{
    height:67vh;
    min-height:430px;
  }

  #status{
    font-size:11px;
  }

  .test{
    font-size:11px;
  }

  .box{
    height:78px;
  }
}
</style>
</head>

<body>

<div id="stage">

  <div class="light blue"></div>
  <div class="light red"></div>

  <div id="status">
    🟢 LIVE STAGE 3D • PRONTO
  </div>

  <div id="name"></div>

  <div id="character"></div>

</div>

<div id="controls">

  <input
    id="cmd"
    placeholder="Digite: hulk, batman, aranha..."
  >

  <button id="test" onclick="testar()">
    TESTAR
  </button>

</div>

<div id="tests">

  <button class="test"
    onclick="show('homem aranha')">
    🕷️ Aranha
  </button>

  <button class="test"
    onclick="show('hulk')">
    💚 Hulk
  </button>

  <button class="test"
    onclick="show('batman')">
    🦇 Batman
  </button>

  <button class="test"
    onclick="show('homem de ferro')">
    🤖 Homem de Ferro
  </button>

  <button class="test"
    onclick="show('superman')">
    🦸 Superman
  </button>

  <button class="test"
    onclick="show('flash')">
    ⚡ Flash
  </button>

  <button class="test"
    onclick="show('ninja')">
    🥷 Ninja
  </button>

  <button class="test"
    onclick="show('alien')">
    👽 Alien
  </button>

  <button class="test"
    onclick="show('mago')">
    🧙 Mago
  </button>

  <button class="test"
    onclick="show('cosmico')">
    🌌 Cósmico
  </button>

</div>

<div id="boxes">
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>
</div>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>


<script>

/* ==========================================
   CONFIGURAÇÃO
========================================== */

const MODEL_URL =
"https://pub-2534e921bf9c4314addcd4d8a6e98b7b.r2.dev/avatars/mixamo/glb/y-bot.glb";


const personagens={

  "homem aranha":{
    nome:"Aranha Urbano",
    cor:0xb40024
  },

  "hulk":{
    nome:"Hulk",
    cor:0x4b9b3b
  },

  "batman":{
    nome:"Batman",
    cor:0x111111
  },

  "homem de ferro":{
    nome:"Homem de Ferro",
    cor:0xc00018
  },

  "superman":{
    nome:"Superman",
    cor:0x185db5
  },

  "flash":{
    nome:"Flash",
    cor:0xd00015
  },

  "ninja":{
    nome:"Ninja",
    cor:0x202030
  },

  "alien":{
    nome:"Alien",
    cor:0x39b96a
  },

  "mago":{
    nome:"Mago Arcano",
    cor:0x641b9b
  },

  "cosmico":{
    nome:"Guerreiro Cósmico",
    cor:0x2635a8
  }

};


/* presentes */

const presentes={

  "rose":"homem aranha",
  "rosa":"homem aranha",

  "lion":"hulk",
  "leao":"hulk",

  "crown":"batman",
  "coroa":"batman",

  "rocket":"homem de ferro",
  "foguete":"homem de ferro",

  "heart":"superman",
  "coracao":"superman",

  "lightning":"flash",
  "raio":"flash",

  "ninja":"ninja",
  "star":"mago",
  "estrela":"mago"

};


/* ==========================================
   THREE
========================================== */

let scene;
let camera;
let renderer;
let model=null;
let mixer=null;

let clock=
  new THREE.Clock();

let ocupado=false;


/* ==========================================
   INICIAR
========================================== */

function init(){

  const container=
    document.getElementById(
      "character"
    );

  scene=
    new THREE.Scene();


  camera=
    new THREE.PerspectiveCamera(
      32,
      window.innerWidth/
      document.getElementById("stage").clientHeight,
      .1,
      100
    );

  camera.position.set(
    0,
    1.7,
    6
  );


  renderer=
    new THREE.WebGLRenderer({
      antialias:true,
      alpha:true
    });


  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      2
    )
  );


  renderer.setSize(
    window.innerWidth,
    document.getElementById("stage").clientHeight
  );


  renderer.shadowMap.enabled=true;

  renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;


  container.appendChild(
    renderer.domElement
  );


  /* iluminação */

  const ambiente=
    new THREE.HemisphereLight(
      0xffffff,
      0x101020,
      2
    );

  scene.add(ambiente);


  const luzPrincipal=
    new THREE.DirectionalLight(
      0xffffff,
      4
    );

  luzPrincipal.position.set(
    3,
    7,
    5
  );

  luzPrincipal.castShadow=true;

  scene.add(luzPrincipal);


  const luzAzul=
    new THREE.PointLight(
      0x008cff,
      40,
      12
    );

  luzAzul.position.set(
    -4,
    3,
    2
  );

  scene.add(luzAzul);


  const luzVermelha=
    new THREE.PointLight(
      0xff003c,
      40,
      12
    );

  luzVermelha.position.set(
    4,
    3,
    2
  );

  scene.add(luzVermelha);


  /* chão */

  const piso=
    new THREE.Mesh(

      new THREE.CircleGeometry(
        2.2,
        64
      ),

      new THREE.MeshStandardMaterial({
        color:0x080808,
        roughness:.4,
        metalness:.5
      })

    );


  piso.rotation.x=
    -Math.PI/2;

  piso.position.y=-2.25;

  piso.receiveShadow=true;

  scene.add(piso);


  carregarModelo();


  window.addEventListener(
    "resize",
    resize
  );


  animate();
}


/* ==========================================
   MODELO 3D REAL
========================================== */

function carregarModelo(){

  const loader=
    new THREE.GLTFLoader();


  loader.load(

    MODEL_URL,

    function(gltf){

      model=
        gltf.scene;


      model.scale.set(
        2.2,
        2.2,
        2.2
      );


      model.position.set(
        0,
        -2.25,
        0
      );


      model.rotation.y=
        Math.PI;


      model.traverse(
        function(obj){

          if(obj.isMesh){

            obj.castShadow=true;
            obj.receiveShadow=true;

          }

        }
      );


      scene.add(model);


      if(gltf.animations &&
         gltf.animations.length){

        mixer=
          new THREE.AnimationMixer(
            model
          );

        mixer.clipAction(
          gltf.animations[0]
        ).play();

      }

    },

    undefined,

    function(error){

      console.error(error);

      document.getElementById(
        "status"
      ).textContent=
        "❌ Não foi possível carregar o modelo 3D";

    }

  );

}


/* ==========================================
   CORES
========================================== */

function aplicarVisual(cor){

  if(!model)return;


  model.traverse(
    function(obj){

      if(!obj.isMesh)return;


      if(!obj.material)return;


      /* deixa o modelo com
         aparência de palco */

      obj.material.roughness=.35;


      /*
        Não pintamos tudo do modelo,
        porque isso destruiria
        as texturas.
      */

    }
  );

}


/* ==========================================
   SHOW
========================================== */

function show(nome){

  const chave=
    normalizar(nome);

  const personagem=
    personagens[chave];


  if(!personagem){

    document.getElementById(
      "status"
    ).textContent=
      "❌ Personagem não encontrado";

    return;
  }


  if(ocupado){

    document.getElementById(
      "status"
    ).textContent=
      "⏳ Aguarde o personagem terminar";

    return;
  }


  ocupado=true;


  const container=
    document.getElementById(
      "character"
    );


  const status=
    document.getElementById(
      "status"
    );


  const name=
    document.getElementById(
      "name"
    );


  if(!model){

    status.textContent=
      "⏳ Carregando modelo 3D...";

    ocupado=false;

    return;
  }


  model.visible=true;

  model.position.set(
    -3.5,
    -2.25,
    0
  );


  name.textContent=
    personagem.nome;

  name.style.display=
    "block";


  container.className=
    "enter";


  status.textContent=
    "🚪 "+personagem.nome+
    " entrando...";


  /* entrada */

  const inicio=
    performance.now();


  function entrada(now){

    const p=
      Math.min(
        (now-inicio)/1200,
        1
      );


    const suave=
      1-Math.pow(
        1-p,
        4
      );


    model.position.x=
      -3.5+
      3.5*suave;


    model.rotation.y=
      Math.PI+
      (1-suave)*1.4;


    if(p<1){

      requestAnimationFrame(
        entrada
      );

    }else{

      dançar();

    }

  }


  requestAnimationFrame(
    entrada
  );
}


/* ==========================================
   DANÇA
========================================== */

function dançar(){

  const status=
    document.getElementById(
      "status"
    );


  const container=
    document.getElementById(
      "character"
    );


  status.textContent=
    "🔥 "+document.getElementById(
      "name"
    ).textContent+
    " está dançando!";


  container.className=
    "dance";


  model.userData.dancando=
    true;


  setTimeout(
    sair,
    5200
  );
}


/* ==========================================
   SAÍDA
========================================== */

function sair(){

  const container=
    document.getElementById(
      "character"
    );


  const status=
    document.getElementById(
      "status"
    );


  status.textContent=
    "🚪 Saindo do palco...";


  container.className=
    "exit";


  const inicio=
    performance.now();


  const xInicial=
    model.position.x;


  function animarSaida(now){

    const p=
      Math.min(
        (now-inicio)/1100,
        1
      );


    model.position.x=
      xInicial+
      4.5*p;


    model.rotation.y=
      Math.PI-
      p*1.3;


    model.scale.setScalar(
      2.2-
      .55*p
    );


    if(p<1){

      requestAnimationFrame(
        animarSaida
      );

    }else{

      finalizar();

    }

  }


  requestAnimationFrame(
    animarSaida
  );
}


/* ==========================================
   FINAL
========================================== */

function finalizar(){

  const container=
    document.getElementById(
      "character"
    );


  const status=
    document.getElementById(
      "status"
    );


  const name=
    document.getElementById(
      "name"
    );


  container.className="";

  container.style.opacity="0";


  name.style.display="none";


  status.textContent=
    "🟢 LIVE STAGE 3D • PRONTO";


  model.visible=false;

  model.scale.set(
    2.2,
    2.2,
    2.2
  );


  ocupado=false;
}


/* ==========================================
   PRESENTE
========================================== */

function receberPresenteTikTok(
  presente
){

  const chave=
    normalizar(presente);


  const personagem=
    presentes[chave];


  if(!personagem){

    document.getElementById(
      "status"
    ).textContent=
      "🎁 Presente recebido: "+
      presente;

    return;
  }


  show(personagem);
}


/* ==========================================
   NORMALIZAR
========================================== */

function normalizar(texto){

  return String(texto)
    .toLowerCase()
    .trim()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    );
}


/* ==========================================
   INPUT
========================================== */

function testar(){

  const campo=
    document.getElementById(
      "cmd"
    );


  show(
    campo.value
  );


  campo.value="";
}


document
  .getElementById("cmd")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key==="Enter"){
        testar();
      }

    }
  );


/* ==========================================
   ANIMAÇÃO
========================================== */

function animate(){

  requestAnimationFrame(
    animate
  );


  const delta=
    clock.getDelta();


  const tempo=
    clock.elapsedTime;


  if(mixer){

    mixer.update(delta);

  }


  if(model &&
     model.visible){

    /* dança procedural */

    if(model.userData.dancando){

      model.position.y=
        -2.25+
        Math.abs(
          Math.sin(
            tempo*5
          )
        )*.13;


      model.rotation.z=
        Math.sin(
          tempo*5
        )*.055;


      model.rotation.y=
        Math.PI+
        Math.sin(
          tempo*2
        )*.12;

    }

  }


  renderer.render(
    scene,
    camera
  );
}


/* ==========================================
   RESIZE
========================================== */

function resize(){

  const stage=
    document.getElementById(
      "stage"
    );


  camera.aspect=
    window.innerWidth/
    stage.clientHeight;


  camera.updateProjectionMatrix();


  renderer.setSize(
    window.innerWidth,
    stage.clientHeight
  );
}


/* ==========================================
   START
========================================== */

init();

</script>

</body>
</html>
